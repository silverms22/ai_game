var PI = Math.PI, TAU = Math.PI * 2;
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function rnd(a, b){ return a + Math.random() * (b - a); }
function irnd(a, b){ return Math.floor(rnd(a, b + 1)); }
function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
function dist2(ax, ay, bx, by){ var dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; }
function lerp(a, b, t){ return a + (b - a) * t; }
function comma(n){
  n = Math.floor(n);
  var s = String(n), out = '', c = 0;
  for (var i = s.length - 1; i >= 0; i--){ out = s[i] + out; if (++c % 3 === 0 && i > 0) out = ',' + out; }
  return out;
}

var IMG = {};
function loadImages(){
  for (var key in IMG_DATA){
    (function(k){
      var d = IMG_DATA[k];
      var rec = { ready:false, img:null, sil:null, w:d.w, h:d.h, p:d };
      IMG[k] = rec;
      if (typeof Image === 'undefined') return;
      try {
        var im = new Image();
        im.onload = function(){
          rec.img = im; rec.w = im.naturalWidth || d.w; rec.h = im.naturalHeight || d.h;
          rec.sil = makeSilhouette(im);       // 피격 플래시용 흰색 실루엣
          rec.ready = true;
        };
        im.onerror = function(){ rec.ready = false; };   // 실패 시 픽셀 스프라이트로 대체
        im.src = d.src;
      } catch (e) {}
    })(key);
  }
}
function makeSilhouette(im){
  try {
    var c = document.createElement('canvas');
    c.width = im.naturalWidth; c.height = im.naturalHeight;
    var x = c.getContext('2d');
    x.drawImage(im, 0, 0);
    x.globalCompositeOperation = 'source-in';
    x.fillStyle = '#ffffff';
    x.fillRect(0, 0, c.width, c.height);
    return c;
  } catch (e) { return null; }
}
/* 캐릭터를 지정 높이에 맞춰 그린다(가로는 원본 비율 유지). 이미지가 없으면 픽셀 스프라이트로 대체 */
function drawChar(key, cx, cy, targetH, opt){
  opt = opt || {};
  var rec = IMG[key];
  if (!rec || !rec.ready || !rec.img){
    var sp = SPRITES[opt.fallback || key] || SPRITES.chichi;
    drawSprite(ctx, sp, cx, cy, targetH / sp.h, opt);
    return;
  }
  var h = targetH, w = targetH * (rec.w / rec.h);
  var x = Math.round(cx - w / 2), y = Math.round(cy - h / 2);
  var prevA = ctx.globalAlpha;
  if (opt.alpha !== undefined) ctx.globalAlpha = prevA * opt.alpha;
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage((opt.flash && rec.sil) ? rec.sil : rec.img, x, y, Math.round(w), Math.round(h));
  ctx.imageSmoothingEnabled = false;
  ctx.globalAlpha = prevA;
}
/* 대화창 캐릭터: 프레임 없이 상반신까지 보이도록 그린다. (cx, bottom) 기준 */
function drawBust(key, cx, bottom, height){
  var rec = IMG[key];
  if (!rec || !rec.ready || !rec.img){
    var sp = SPRITES[key] || SPRITES.chichi;
    drawSprite(ctx, sp, cx, bottom - height / 2, height / sp.h);
    return;
  }
  var ratio = rec.p.bust || 0.75;
  var sh = rec.h * ratio;
  var w = height * (rec.w / sh);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(rec.img, 0, 0, rec.w, sh, Math.round(cx - w / 2), Math.round(bottom - height), Math.round(w), Math.round(height));
  ctx.imageSmoothingEnabled = false;
}

/* --- 스프라이트 렌더러 --- */
function drawSprite(ctx, sp, cx, cy, scale, opt){
  opt = opt || {};
  var w = sp.w * scale, h = sp.h * scale;
  var x0 = Math.round(cx - w / 2), y0 = Math.round(cy - h / 2);
  var s = Math.ceil(scale), flash = opt.flash;
  var alpha = (opt.alpha === undefined) ? 1 : opt.alpha;
  var prevA = ctx.globalAlpha;
  if (alpha !== 1) ctx.globalAlpha = prevA * alpha;
  for (var r = 0; r < sp.h; r++){
    var row = sp.rows[r];
    if (!row) continue;
    for (var c = 0; c < sp.w; c++){
      var ch = row.charAt(c);
      if (!ch || ch === '.' || ch === ' ') continue;
      var col = flash ? '#ffffff' : sp.colors[ch];
      if (!col) continue;
      ctx.fillStyle = col;
      ctx.fillRect(x0 + c * scale, y0 + r * scale, s, s);
    }
  }
  ctx.globalAlpha = prevA;
}

/* 초상화: 스프라이트 머리 부분만 확대해서 그림 */
function drawPortrait(ctx, sp, x, y, size){
  var scale = size / sp.w;
  var s = Math.ceil(scale);
  for (var r = 0; r < sp.head; r++){
    var row = sp.rows[r];
    if (!row) continue;
    for (var c = 0; c < sp.w; c++){
      var ch = row.charAt(c);
      if (!ch || ch === '.' || ch === ' ') continue;
      var col = sp.colors[ch];
      if (!col) continue;
      ctx.fillStyle = col;
      ctx.fillRect(Math.round(x + c * scale), Math.round(y + r * scale), s, s);
    }
  }
}

var canvas = document.getElementById('cv');
var ctx = canvas.getContext('2d', { alpha: false });
var cssScale = 1;

function resize(){
  var ww = window.innerWidth || CFG.VW;
  var wh = window.innerHeight || CFG.VH;
  var s = Math.min(ww / CFG.VW, wh / CFG.VH);
  if (!(s > 0)) s = 1;
  var dpr = Math.min(window.devicePixelRatio || 1, 3);
  cssScale = s;
  canvas.style.width = (CFG.VW * s) + 'px';
  canvas.style.height = (CFG.VH * s) + 'px';
  canvas.width = Math.round(CFG.VW * s * dpr);
  canvas.height = Math.round(CFG.VH * s * dpr);
  ctx.setTransform(s * dpr, 0, 0, s * dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
  if ('mozImageSmoothingEnabled' in ctx) ctx.mozImageSmoothingEnabled = false;
  if ('webkitImageSmoothingEnabled' in ctx) ctx.webkitImageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 120); });


/* =========================================================================
   4.5 사운드 (BGM / 효과음)
   ========================================================================= */
var SND = { bgm: [], cur: -1, dmg: null, hitPool: [], hitIdx: 0, hitT: 0, enabled: true, unlocked: false, pending: null };

function makeAudio(url, vol, loop){
  if (typeof Audio === 'undefined') return null;
  try {
    var a = new Audio();
    a.preload = 'auto';
    a.loop = !!loop;
    a.volume = vol;
    a.src = url;
    return a;
  } catch (e){ return null; }
}
function initAudio(){
  var A = CFG.AUDIO;
  for (var i = 0; i < A.BGM.length; i++) SND.bgm.push(makeAudio(A.BGM[i], A.BGM_VOLUME, true));
  SND.dmg = makeAudio(A.DAMAGE, A.DAMAGE_VOLUME, false);
  for (var j = 0; j < 4; j++) SND.hitPool.push(makeAudio(A.BOSS_HIT, A.BOSS_HIT_VOLUME, false));
}
function safePlay(a){
  if (!a) return null;
  try {
    var p = a.play();
    if (p && p.then) p.then(function(){}, function(){});
    return p;
  } catch (e){ return null; }
}
/* 아직 로딩 전인 오디오에 currentTime을 쓰면 예외가 발생하므로 준비된 경우에만 되감는다 */
function rewind(a){
  if (!a) return;
  try { if (a.readyState > 0 && a.currentTime > 0) a.currentTime = 0; } catch (e){}
}
function playBGM(){
  if (!SND.enabled || !SND.bgm.length) return;
  stopBGM();
  var idx = Math.floor(Math.random() * SND.bgm.length);   // 라운드마다 무작위 선택
  SND.cur = idx;
  var a = SND.bgm[idx];
  if (!a) return;
  a.volume = CFG.AUDIO.BGM_VOLUME;
  rewind(a);
  SND.pending = a;                 // 자동재생이 막히면 다음 입력에서 다시 시도
  var p = safePlay(a);
  if (p && p.then) p.then(function(){ if (SND.pending === a) SND.pending = null; }, function(){});
  else SND.pending = null;
}
function stopBGM(){
  SND.pending = null;
  for (var i = 0; i < SND.bgm.length; i++){
    var a = SND.bgm[i];
    if (!a) continue;
    try { a.pause(); } catch (e){}
    rewind(a);
  }
  SND.cur = -1;
}
function playSfx(a, vol){
  if (!SND.enabled || !a) return;
  if (vol !== undefined) a.volume = vol;
  rewind(a);
  safePlay(a);
}
function sfxDamage(){ playSfx(SND.dmg, CFG.AUDIO.DAMAGE_VOLUME); }
function sfxBossHit(){
  if (SND.hitT > 0 || !SND.hitPool.length) return;   // 연타 시 소리가 겹치지 않도록 간격 제한
  SND.hitT = CFG.AUDIO.BOSS_HIT_MIN_GAP;
  playSfx(SND.hitPool[SND.hitIdx % SND.hitPool.length], CFG.AUDIO.BOSS_HIT_VOLUME);
  SND.hitIdx++;
}
/* 모바일 브라우저는 사용자 입력 이후에만 소리를 낼 수 있으므로 첫 입력에서 해제 */
function unlockAudio(){
  if (!SND.unlocked){
    SND.unlocked = true;
    // BGM/효과음 모두 각각 한 번씩 재생해 두어야 이후 프로그램 재생이 허용된다
    var all = SND.bgm.concat([SND.dmg]).concat(SND.hitPool);
    for (var i = 0; i < all.length; i++){
      var a = all[i];
      if (!a) continue;
      var vol = a.volume;
      try {
        a.volume = 0;
        var pr = a.play();
        if (pr && pr.then) pr.then(function(){}, function(){});
        a.pause();
        a.volume = vol;
      } catch (e){ a.volume = vol; }
    }
  }
  // 자동재생이 막혀 대기 중인 BGM이 있으면 사용자 입력 시점에 다시 시도
  if (SND.pending){
    var pending = SND.pending;
    pending.volume = CFG.AUDIO.BGM_VOLUME;
    var p2 = safePlay(pending);
    if (p2 && p2.then) p2.then(function(){ if (SND.pending === pending) SND.pending = null; }, function(){});
  }
}

/* =========================================================================
   5. 입력 / 가상 조이스틱
   ========================================================================= */
var JOY = {
  active: false, id: null,
  baseX: 0, baseY: 0, x: 0, y: 0,
  dx: 0, dy: 0, maxR: 62,
};
var input = { keys: {}, tap: false, tapLock: 0, downIds: {} };

function localPos(e){
  var rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) / cssScale,
    y: (e.clientY - rect.top) / cssScale
  };
}
function joyZone(p){
  // 전투 중에는 화면 어디를 누르든 그 자리에서 조이스틱이 생성된다
  return p.x >= 0 && p.x <= CFG.VW && p.y >= 0 && p.y <= CFG.VH;
}
function canUseJoystick(){
  return G.state === ST.WAVE || G.state === ST.WAVE_CLEAR ||
         G.state === ST.BOSS_ENTER || G.state === ST.BOSS_FIGHT || G.state === ST.BOSS_DEATH;
}

function onDown(e){
  unlockAudio();
  var p = localPos(e);
  var id = (e.pointerId !== undefined) ? e.pointerId : 0;
  input.downIds[id] = true;
  if (canUseJoystick() && !JOY.active && joyZone(p)){
    JOY.active = true; JOY.id = id;
    JOY.baseX = p.x; JOY.baseY = p.y; JOY.x = p.x; JOY.y = p.y;
    JOY.dx = 0; JOY.dy = 0;
    return;
  }
  input.tap = true;
}
function onMove(e){
  var id = (e.pointerId !== undefined) ? e.pointerId : 0;
  if (!JOY.active || JOY.id !== id) return;
  var p = localPos(e);
  var dx = p.x - JOY.baseX, dy = p.y - JOY.baseY;
  var d = Math.sqrt(dx * dx + dy * dy);
  if (d > JOY.maxR){ dx = dx / d * JOY.maxR; dy = dy / d * JOY.maxR; d = JOY.maxR; }
  JOY.x = JOY.baseX + dx; JOY.y = JOY.baseY + dy;
  var dead = 6;
  if (d < dead){ JOY.dx = 0; JOY.dy = 0; }
  else { JOY.dx = dx / JOY.maxR; JOY.dy = dy / JOY.maxR; }
}
function onUp(e){
  var id = (e.pointerId !== undefined) ? e.pointerId : 0;
  delete input.downIds[id];
  if (JOY.active && JOY.id === id) releaseJoystick();
}
function releaseJoystick(){
  JOY.active = false; JOY.id = null; JOY.dx = 0; JOY.dy = 0;
  JOY.x = JOY.baseX; JOY.y = JOY.baseY;
}


if (window.PointerEvent){
  canvas.addEventListener('pointerdown', function(e){
    e.preventDefault();
    // 손가락이 캔버스 밖으로 나가도 드래그가 끊기지 않도록 포인터를 캡처
    if (canvas.setPointerCapture && e.pointerId !== undefined){
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    }
    onDown(e);
  }, { passive:false });
  window.addEventListener('pointermove', function(e){ onMove(e); }, { passive:false });
  window.addEventListener('pointerup', function(e){ onUp(e); }, { passive:false });
  window.addEventListener('pointercancel', function(e){ onUp(e); }, { passive:false });
} else {
  canvas.addEventListener('touchstart', function(e){
    e.preventDefault();
    for (var i = 0; i < e.changedTouches.length; i++){
      var t = e.changedTouches[i]; onDown({ clientX:t.clientX, clientY:t.clientY, pointerId:t.identifier });
    }
  }, { passive:false });
  window.addEventListener('touchmove', function(e){
    e.preventDefault();
    for (var i = 0; i < e.changedTouches.length; i++){
      var t = e.changedTouches[i]; onMove({ clientX:t.clientX, clientY:t.clientY, pointerId:t.identifier });
    }
  }, { passive:false });
  var tEnd = function(e){
    e.preventDefault();
    for (var i = 0; i < e.changedTouches.length; i++){
      var t = e.changedTouches[i]; onUp({ clientX:t.clientX, clientY:t.clientY, pointerId:t.identifier });
    }
  };
  window.addEventListener('touchend', tEnd, { passive:false });
  window.addEventListener('touchcancel', tEnd, { passive:false });
  canvas.addEventListener('mousedown', function(e){ e.preventDefault(); onDown(e); });
  window.addEventListener('mousemove', function(e){ onMove(e); });
  window.addEventListener('mouseup', function(e){ onUp(e); });
}

document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
document.addEventListener('dblclick', function(e){ e.preventDefault(); });
document.addEventListener('contextmenu', function(e){ e.preventDefault(); });

window.addEventListener('keydown', function(e){
  unlockAudio();
  input.keys[e.key.toLowerCase()] = true;
  if (e.key === ' ' || e.key === 'Enter'){ input.tap = true; e.preventDefault(); }
  if (['arrowup','arrowdown','arrowleft','arrowright'].indexOf(e.key.toLowerCase()) >= 0) e.preventDefault();
});
window.addEventListener('keyup', function(e){ input.keys[e.key.toLowerCase()] = false; });

function consumeTap(){
  if (input.tap && input.tapLock <= 0){ input.tap = false; input.tapLock = 0.18; return true; }
  input.tap = false;
  return false;
}
function keyVector(){
  var k = input.keys, x = 0, y = 0;
  if (k['arrowleft'] || k['a']) x -= 1;
  if (k['arrowright'] || k['d']) x += 1;
  if (k['arrowup'] || k['w']) y -= 1;
  if (k['arrowdown'] || k['s']) y += 1;
  return { x:x, y:y };
}

var ST = {

var G = {

function resetAll(){

function makeStars(){

    G.bgStars.push({ x: rnd(0, CFG.VW), y: rnd(0, CFG.VH), s: rnd(0.9, 2.4), sp: rnd(6, 22), tw: rnd(0, TAU) });
  }

  for (var j = 0; j < 5; j++){

/* =========================================================================
   7. 파티클 / 부유 텍스트 / 화면 흔들림
   ========================================================================= */
function addParticle(x, y, vx, vy, life, color, size, kind){
  if (G.particles.length >= CFG.MAX_PARTICLES) return;
  G.particles.push({ x:x, y:y, vx:vx, vy:vy, life:life, max:life, color:color, size:size||3, kind:kind||'sq', rot:rnd(0,TAU) });
}
function burst(x, y, n, color, spd, size, kind){
  for (var i = 0; i < n; i++){
    var a = rnd(0, TAU), s = rnd(spd * 0.35, spd);
    addParticle(x, y, Math.cos(a) * s, Math.sin(a) * s, rnd(0.22, 0.55), color, size, kind);
  }
}
function addText(x, y, text, color, size, life){
  G.texts.push({ x:x, y:y, text:text, color:color || '#ffffff', size:size || 14, life:life || 0.8, max:life || 0.8 });
}
function shake(v){ G.shake = Math.min(16, G.shake + v); }
function flash(v, color){ G.flash = Math.min(1, G.flash + v); if (color) G.flashColor = color; }

function updateParticles(dt){
  for (var i = G.particles.length - 1; i >= 0; i--){
    var p = G.particles[i];
    p.life -= dt;
    if (p.life <= 0){ G.particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += 220 * dt; p.vx *= 0.98; p.rot += dt * 6;
  }
  for (var j = G.texts.length - 1; j >= 0; j--){
    var t = G.texts[j];
    t.life -= dt;
    if (t.life <= 0){ G.texts.splice(j, 1); continue; }
    t.y -= 34 * dt;
  }
}

/* =========================================================================
   8. 플레이어
   ========================================================================= */
function updatePlayer(dt, canMove){
  var p = G.player;
  if (!p) return;
  p.anim += dt;
  if (p.invuln > 0) p.invuln -= dt;

  var mx = 0, my = 0;
  if (canMove){
    if (JOY.active && (JOY.dx !== 0 || JOY.dy !== 0)){ mx = JOY.dx; my = JOY.dy; }
    else { var kv = keyVector(); mx = kv.x; my = kv.y; }
    var len = Math.sqrt(mx * mx + my * my);
    if (len > 1){ mx /= len; my /= len; }         // 대각선 보정(벡터 정규화)
  }
  p.x = clamp(p.x + mx * CFG.PLAYER.speed * dt, CFG.PLAYER.minX, CFG.PLAYER.maxX);
  p.y = clamp(p.y + my * CFG.PLAYER.speed * dt, CFG.PLAYER.minY, CFG.PLAYER.maxY);
}

function damagePlayer(){
  var p = G.player;
  if (!p || p.invuln > 0 || G.state === ST.GAMEOVER) return;
  G.hearts--;
  p.invuln = CFG.PLAYER.invuln;
  shake(9); flash(0.55, '255,70,70');
  burst(p.x, p.y, 14, '#ff5a7a', 210, 4);
  sfxDamage();

  // 공격력 단계 하락 + 잃은 만큼 P아이템을 주변에 흩뿌림(회수 가능)
  var lost = Math.min(CFG.PLAYER.powerLossOnHit, G.plv - 1);
  if (lost > 0){
    G.plv -= lost;
    G.pKillAcc = 0;
    for (var li = 0; li < lost; li++){
      var ang = -PI / 2 + (li - (lost - 1) / 2) * 0.85 + rnd(-0.14, 0.14);
      var spd = rnd(190, 260);
      scatterItem(p.x, p.y - 6, 'P', Math.cos(ang) * spd, Math.sin(ang) * spd);
    }
    addText(p.x, p.y - 46, 'POWER DOWN', '#ff9ec2', 16, 1.0);
  }
  if (G.hearts <= 0){ G.hearts = 0; gameOver(); }
}

function gameOver(){
  stopBGM();
  G.state = ST.GAMEOVER;
  G.stateT = 0;
  G.ebullets.length = 0;
  input.tap = false;
  releaseJoystick();
  if (G.player) burst(G.player.x, G.player.y, 26, '#ffcc6b', 260, 5);
}

/* =========================================================================
   9. 플레이어 탄환 / 유도탄
   ========================================================================= */
function addPB(x, y, vx, vy, dmg, kind){
  if (G.pbullets.length >= CFG.MAX_PB) return;
  G.pbullets.push({ x:x, y:y, vx:vx, vy:vy, dmg:dmg, kind:kind, r: kind === 'homing' ? 7 : (kind === 'opt' ? 4 : 5), tgt:null, t:0 });
}

function optionOffsets(){
  var lv = G.plv;
  if (lv === 4) return [-24, 24];
  if (lv >= 5) return [-24, 24, -38, 38];
  return [];
}

function playerFire(dt){
  var p = G.player;
  if (!p) return;
  var F = CFG.FIRE, lv = G.plv;

  p.fireT -= dt;
  if (p.fireT <= 0){
    p.fireT += F.mainInterval;
    var dmg = F.mainDmg;
    if (lv === 1) addPB(p.x, p.y - 16, 0, -F.mainSpeed, dmg, 'main');
    else if (lv === 2){ addPB(p.x - 7, p.y - 16, 0, -F.mainSpeed, dmg, 'main'); addPB(p.x + 7, p.y - 16, 0, -F.mainSpeed, dmg, 'main'); }
    else if (lv >= 3 && lv <= 5){
      addPB(p.x, p.y - 18, 0, -F.mainSpeed, dmg, 'main');
      addPB(p.x - 11, p.y - 12, 0, -F.mainSpeed, dmg, 'main');
      addPB(p.x + 11, p.y - 12, 0, -F.mainSpeed, dmg, 'main');
    } else {
      // 6단계 이상: 부채꼴 5발
      for (var i = -2; i <= 2; i++){
        var a = -PI / 2 + i * F.fanSpread * 0.5;
        addPB(p.x, p.y - 16, Math.cos(a) * F.mainSpeed, Math.sin(a) * F.mainSpeed, dmg, 'main');
      }
    }
  }

  var offs = optionOffsets();
  if (offs.length){
    p.optT -= dt;
    if (p.optT <= 0){
      p.optT += F.optInterval;
      for (var k = 0; k < offs.length; k++){
        addPB(p.x + offs[k], p.y - 6, 0, -F.optSpeed, F.optDmg, 'opt');
      }
    }
  }

  if (lv >= 7){
    p.homT -= dt;
    if (p.homT <= 0){
      p.homT += F.homInterval;
      var n = lv === 7 ? 1 : (lv === 8 ? 2 : 3);
      for (var h = 0; h < n; h++){
        var ang = -PI / 2 + (h - (n - 1) / 2) * 0.5;
        addPB(p.x, p.y - 10, Math.cos(ang) * F.homSpeed, Math.sin(ang) * F.homSpeed, F.homDmg, 'homing');
      }
    }
  }
}

function findHomingTarget(b){
  var best = null, bd = Infinity;
  for (var i = 0; i < G.enemies.length; i++){
    var e = G.enemies[i];
    if (!e.alive) continue;
    var d = dist2(b.x, b.y, e.x, e.y);
    if (d < bd){ bd = d; best = e; }
  }
  if (!best && G.boss && G.boss.alive && G.boss.fighting) best = G.boss;
  return best;
}

function updatePBullets(dt){
  var F = CFG.FIRE;
  for (var i = G.pbullets.length - 1; i >= 0; i--){
    var b = G.pbullets[i];
    b.t += dt;
    if (b.kind === 'homing'){
      if (!b.tgt || !b.tgt.alive) b.tgt = findHomingTarget(b);
      if (b.tgt && b.tgt.alive){
        var want = Math.atan2(b.tgt.y - b.y, b.tgt.x - b.x);
        var cur = Math.atan2(b.vy, b.vx);
        var diff = want - cur;
        while (diff > PI) diff -= TAU;
        while (diff < -PI) diff += TAU;
        var turn = clamp(diff, -F.homTurn * dt, F.homTurn * dt);
        var na = cur + turn;
        b.vx = Math.cos(na) * F.homSpeed; b.vy = Math.sin(na) * F.homSpeed;
      } else {
        // 타깃을 잃으면 위쪽으로 진행
        var ca = Math.atan2(b.vy, b.vx);
        var d2 = -PI / 2 - ca;
        while (d2 > PI) d2 -= TAU;
        while (d2 < -PI) d2 += TAU;
        var na2 = ca + clamp(d2, -F.homTurn * dt, F.homTurn * dt);
        b.vx = Math.cos(na2) * F.homSpeed; b.vy = Math.sin(na2) * F.homSpeed;
      }
      if (b.t % 0.06 < dt) addParticle(b.x, b.y, rnd(-14,14), rnd(10,40), 0.25, '#8ff0ff', 2);
    }
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y < -40 || b.y > CFG.VH + 40 || b.x < -50 || b.x > CFG.VW + 50) G.pbullets.splice(i, 1);
  }
}

/* =========================================================================
   10. 적 탄환
   ========================================================================= */
function addEB(x, y, vx, vy, opt){
  if (G.ebullets.length >= CFG.MAX_EB) return null;
  opt = opt || {};
  var b = {
    x:x, y:y, vx:vx, vy:vy,
    r: opt.r || 7,
    hr: opt.hr || (opt.r || 7) * 0.74,
    type: opt.type || 'ball',
    color: opt.color || '#ff6ec7',
    color2: opt.color2 || '#ffd8f2',
    rot: opt.rot || 0, rotSpd: opt.rotSpd || 0,
    t: 0, beh: opt.beh || null, data: opt.data || null
  };
  G.ebullets.push(b);
  return b;
}
function ebSpeedMul(){ return CFG.ROUND.ebSpdMul[G.round] || 1; }

function shootAt(x, y, tx, ty, speed, opt){
  var a = Math.atan2(ty - y, tx - x);
  return addEB(x, y, Math.cos(a) * speed, Math.sin(a) * speed, opt);
}
function shootAtPlayer(x, y, speed, opt, offset){
  var p = G.player;
  if (!p) return null;
  var a = Math.atan2(p.y - y, p.x - x) + (offset || 0);
  return addEB(x, y, Math.cos(a) * speed, Math.sin(a) * speed, opt);
}
function ring(x, y, count, speed, start, opt, gaps){
  for (var i = 0; i < count; i++){
    if (gaps && gaps.indexOf(i) >= 0) continue;    // 항상 통과 가능한 빈틈 유지
    var a = start + i * TAU / count;
    addEB(x, y, Math.cos(a) * speed, Math.sin(a) * speed, opt);
  }
}
function fan(x, y, dir, count, spread, speed, opt){
  for (var i = 0; i < count; i++){
    var a = dir + (count === 1 ? 0 : (i / (count - 1) - 0.5) * spread);
    addEB(x, y, Math.cos(a) * speed, Math.sin(a) * speed, opt);
  }
}

function updateEBullets(dt){
  var margin = 60;
  for (var i = G.ebullets.length - 1; i >= 0; i--){
    var b = G.ebullets[i];
    b.t += dt;
    if (b.beh) b.beh(b, dt);
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.rot += b.rotSpd * dt;
    if (b.x < -margin || b.x > CFG.VW + margin || b.y < -margin - 40 || b.y > CFG.VH + margin){
      G.ebullets.splice(i, 1);
    }
  }
  for (var w = G.warns.length - 1; w >= 0; w--){
    var wn = G.warns[w];
    wn.t += dt;
    if (wn.t >= wn.delay){
      if (wn.cb) { try { wn.cb(wn); } catch(err){} }
      G.warns.splice(w, 1);
    }
  }
}
function addWarn(x, y, ang, delay, cb){
  G.warns.push({ x:x, y:y, ang:ang, t:0, delay:delay, cb:cb });
}

function addItem(x, y, type){

function scatterItem(x, y, type, vx, vy){
  G.items.push({ x:x, y:y, type:type, vx:vx, vy:vy, t:0, r:16, scatter:true, noPick: CFG.PLAYER.lostItemPickDelay });
}
/* P아이템은 일정 횟수마다 큰 빨간 P(2단계 상승)로 나온다 */
function dropP(x, y){
  G.pDropCount++;
  if (G.pDropCount % CFG.DROP.bigPEvery === 0) addItem(x, y, 'PBIG');
  else addItem(x, y, 'P');
}
function rollDrop(x, y){
  var r = G.round;
  G.pKillAcc++;
  if (G.pKillAcc >= (CFG.DROP.pEvery[r] || 10)){
    G.pKillAcc = 0;
    dropP(x, y);
    return;
  }
  var v = Math.random();
  var pc = CFG.DROP.pRandom[r] || 0.02, hc = CFG.DROP.heart[r] || 0.05;
  if (v < pc) dropP(x, y);
  else if (v < pc + hc) addItem(x, y, 'heart');
}
function updateItems(dt){
  var p = G.player;
  for (var i = G.items.length - 1; i >= 0; i--){
    var it = G.items[i];
    it.t += dt;
    if (it.scatter){
      it.x += it.vx * dt;
      it.y += it.vy * dt;
      it.vy += 300 * dt;
      it.vx *= 0.97;
      if (it.x < 24){ it.x = 24; it.vx = Math.abs(it.vx) * 0.6; }
      if (it.x > CFG.VW - 24){ it.x = CFG.VW - 24; it.vx = -Math.abs(it.vx) * 0.6; }
      if (it.vy >= 74){ it.vy = 74; it.vx = 0; it.scatter = false; }
    } else {
      it.y += it.vy * dt;
      it.x += Math.sin(it.t * 2.2) * 16 * dt;
    }
    if (it.noPick > 0) it.noPick -= dt;
    if (it.y > CFG.VH + 30){ G.items.splice(i, 1); continue; }
    if (p && !(it.noPick > 0) && dist2(p.x, p.y, it.x, it.y) < (it.r + 18) * (it.r + 18)){
      pickupItem(it);
      G.items.splice(i, 1);
    }
  }
}
function pickupItem(it){
  var p = G.player;
  for (var i = 0; i < 8; i++){
    var a = rnd(0, TAU);
    addParticle(it.x, it.y, Math.cos(a) * rnd(60, 170), Math.sin(a) * rnd(60, 170), rnd(0.3, 0.6), '#fff8b0', 4, 'star');
  }
  if (it.type === 'P' || it.type === 'PBIG'){
    var up = (it.type === 'PBIG') ? CFG.DROP.bigPLevels : 1;
    if (G.plv < 9){
      var before = G.plv;
      G.plv = Math.min(9, G.plv + up);
      G.powerText = 1.0;
      var gained = G.plv - before;
      addText(p.x, p.y - 40, gained > 1 ? ('POWER UP! x' + gained) : 'POWER UP!',
              it.type === 'PBIG' ? '#ff8a9a' : '#8ff0ff', it.type === 'PBIG' ? 20 : 18, 1.1);
      flash(it.type === 'PBIG' ? 0.3 : 0.2, it.type === 'PBIG' ? '255,140,160' : '160,255,255');
    } else {
      var bonus = CFG.SCORE.pMaxBonus * up;
      G.score += bonus;
      addText(p.x, p.y - 40, '+' + bonus, '#ffe58a', 16, 0.9);
    }
  } else if (it.type === 'heart'){
    if (G.hearts < G.maxHearts){
      G.hearts++;
      addText(p.x, p.y - 40, 'HEART +1', '#ff9ec2', 16, 0.9);
    } else {
      G.score += CFG.SCORE.heartFullBonus;
      addText(p.x, p.y - 40, '+' + CFG.SCORE.heartFullBonus, '#ffe58a', 16, 0.9);
    }
  } else if (it.type === 'maxheart'){
    if (G.maxHearts < CFG.PLAYER.maxHeartsCap) G.maxHearts++;
    G.hearts = Math.min(G.maxHearts, G.hearts + 1);
    addText(p.x, p.y - 42, 'MAX HEART UP!', '#ff5f7a', 18, 1.1);
    flash(0.25, '255,120,150');
  }
}

function createBoss(round){
  var def = BOSS_DEFS[round];
  var hp = CFG.BOSS.hp[round];
  return {
    def: def, name: def.name, round: round,
    x: CFG.VW / 2, y: -70, homeY: CFG.BOSS.homeY[round],
    hp: hp, maxHp: hp, dispHp: hp,
    r: CFG.BOSS.r, alive: true, fighting: false,
    t: 0, moveT: 0, flash: 0, hitBar: 0,
    phase: 1, patIndex: 0, patKey: null, pat: null,
    patT: 0, acc: 0, shot: 0, rest: 0, pending: null,
    bubble: 0, bubbleText: '', anim: 0
  };
}

function bossPickPattern(B){
  var sched = B.def.schedule[B.phase] || B.def.schedule[1];
  var key = sched[B.patIndex % sched.length];
  B.patIndex++;
  var pat = B.def.patterns[key];
  if (!pat){ B.rest = 0.5; return; }
  if (pat.telegraph){
    B.bubble = 1.25;
    B.bubbleText = CFG.BOSS_BUBBLE[B.def.key] || '';
    B.rest = 0.7;
    B.pending = key;
  } else {
    bossStartPattern(B, key);
  }
}
function bossStartPattern(B, key){
  B.patKey = key;
  B.pat = B.def.patterns[key];
  B.patT = 0; B.acc = 0; B.shot = 0;
  B.pending = null;
}

function updateBossFightLogic(dt){
  var B = G.boss;
  if (!B || !B.alive) return;
  B.t += dt; B.anim += dt;
  if (B.flash > 0) B.flash -= dt;
  if (B.hitBar > 0) B.hitBar -= dt;
  if (B.bubble > 0) B.bubble -= dt;
  B.dispHp = lerp(B.dispHp, B.hp, Math.min(1, dt * 6));

  // 좌우 이동
  B.moveT += dt * CFG.BOSS.moveSpeed[B.round];
  B.x = CFG.VW / 2 + Math.sin(B.moveT) * CFG.BOSS.moveRange[B.round];
  B.y = B.homeY + Math.sin(B.moveT * 1.7) * 12;

  // 페이즈 전환
  var ratio = B.hp / B.maxHp;
  var np = ratio <= CFG.BOSS_PHASE.p3 ? 3 : (ratio <= CFG.BOSS_PHASE.p2 ? 2 : 1);
  if (np !== B.phase){
    B.phase = np;
    B.patIndex = 0;
    B.rest = 0.7; B.pat = null; B.pending = null;
    shake(6); flash(0.22, '255,220,160');
    addText(B.x, B.y + 46, 'PHASE ' + np, '#ffe58a', 18, 1.0);
  }

  // 탄환 상한 도달 시 새 패턴 생성을 잠시 제한
  var overflow = G.ebullets.length > CFG.MAX_EB * CFG.EB_SOFT_CAP;

  if (B.rest > 0){
    B.rest -= dt;
    if (B.rest <= 0){
      if (B.pending) bossStartPattern(B, B.pending);
      else if (!B.pat) bossPickPattern(B);
    }
    return;
  }
  if (!B.pat){ bossPickPattern(B); return; }

  B.patT += dt;
  if (!overflow){
    B.acc += dt;
    var guard = 0;
    while (B.acc >= B.pat.interval * bossPhaseMul(B).rate && guard++ < 8){
      B.acc -= B.pat.interval * bossPhaseMul(B).rate;
      try { B.pat.fire(B, B.shot++); } catch(err){}
    }
  }
  if (B.patT >= B.pat.dur){
    B.pat = null; B.patKey = null;
    B.rest = CFG.BOSS.restTime * bossPhaseMul(B).rate;
  }
}

function damageBoss(B, dmg){
  if (!B.alive || !B.fighting) return;
  B.hp -= dmg;
  B.flash = 0.07;
  sfxBossHit();
  B.hitBar = 0.18;
  G.bossDamageAcc += dmg;
  while (G.bossDamageAcc >= CFG.SCORE.bossDamageUnit){
    G.bossDamageAcc -= CFG.SCORE.bossDamageUnit;
    G.score += CFG.SCORE.bossDamageScore;
  }
  if (B.hp <= 0){ B.hp = 0; bossDie(B); }
}

function bossDie(B){
  B.alive = false; B.fighting = false;
  G.ebullets.length = 0;                 // 사망 즉시 적 탄막 제거
  G.warns.length = 0;
  G.enemies.length = 0;
  G.score += CFG.SCORE.bossKill[B.round] + G.hearts * CFG.SCORE.survivePerHeart;
  shake(15); flash(0.85, '255,240,200');
  G.slowmo = 0.35;
  for (var i = 0; i < 5; i++){
    burst(B.x + rnd(-30, 30), B.y + rnd(-30, 30), 14, i % 2 ? '#ffd66e' : '#ffffff', 300, 6);
  }
  addText(B.x, B.y - 40, '+' + comma(CFG.SCORE.bossKill[B.round]), '#ffe58a', 20, 1.4);
  G.state = ST.BOSS_DEATH;
  G.stateT = 0.3;                        // 0.3초 후 처치 대화
}

function startDialog(lines, onEnd){
  G.dialog = {
    lines: lines, i: 0, onEnd: onEnd,
    lock: CFG.DIALOG_DEBOUNCE, appear: 0
  };
  // 조이스틱을 누르고 있던 터치가 대화 넘김으로 처리되지 않도록 입력을 초기화
  releaseJoystick();
  input.tap = false;
  G.prevState = G.state;
  G.state = ST.DIALOG;
  if (G.player) G.player.diary = 0;
  var cur = lines[0];
  if (cur && cur.special === 'diary' && G.player) G.player.diary = 1;
}

function updateDialog(dt){
  var d = G.dialog;
  if (!d){ G.state = ST.BOSS_FIGHT; return; }
  d.appear += dt;
  if (d.lock > 0){ d.lock -= dt; input.tap = false; return; }
  if (input.tap){
    input.tap = false;
    d.lock = CFG.DIALOG_DEBOUNCE;
    d.i++;
    if (d.i >= d.lines.length){
      var cb = d.onEnd;
      G.dialog = null;
      if (G.player) G.player.diary = 0;
      if (cb) cb();
      return;
    }
    var cur = d.lines[d.i];
    if (G.player) G.player.diary = (cur && cur.special === 'diary') ? 1 : 0;
  }
}

   ========================================================================= */
function collide(){
  var p = G.player;
  // 플레이어 탄환 → 잡몹 / 보스
  for (var i = G.pbullets.length - 1; i >= 0; i--){
    var b = G.pbullets[i], hit = false;
    for (var j = 0; j < G.enemies.length; j++){
      var e = G.enemies[j];
      if (!e.alive) continue;
      var rr = e.r + b.r;
      if (dist2(b.x, b.y, e.x, e.y) < rr * rr){
        e.hp -= b.dmg; e.flash = 0.09;
        var big = (b.kind === 'homing');
        burst(b.x, b.y, big ? 8 : 4, big ? '#8ff0ff' : '#fff3b0', big ? 190 : 120, big ? 4 : 3);
        if (e.hp <= 0) killMob(e, true);
        hit = true;
        break;
      }
    }
    if (!hit && G.boss && G.boss.alive && G.boss.fighting){
      var B = G.boss, br = B.r + b.r;
      if (dist2(b.x, b.y, B.x, B.y) < br * br){
        damageBoss(B, b.dmg);
        burst(b.x, b.y, b.kind === 'homing' ? 9 : 4, b.kind === 'homing' ? '#8ff0ff' : '#fff3b0', 150, b.kind === 'homing' ? 4 : 3);
        hit = true;
      }
    }
    if (hit) G.pbullets.splice(i, 1);
  }

  if (!p || p.invuln > 0) return;

  // 적 탄환 → 플레이어 코어
  for (var k = G.ebullets.length - 1; k >= 0; k--){
    var eb = G.ebullets[k];
    var r2 = eb.hr + CFG.PLAYER.hitR;
    if (dist2(eb.x, eb.y, p.x, p.y) < r2 * r2){
      G.ebullets.splice(k, 1);
      damagePlayer();
      return;
    }
  }
  // 적 본체 → 플레이어
  for (var m = 0; m < G.enemies.length; m++){
    var en = G.enemies[m];
    if (!en.alive) continue;
    var rr2 = en.r + CFG.PLAYER.bodyR * 0.55;
    if (dist2(en.x, en.y, p.x, p.y) < rr2 * rr2){ damagePlayer(); return; }
  }
  // 보스 본체 → 플레이어
  if (G.boss && G.boss.alive && G.boss.fighting){
    var Bb = G.boss, rb = Bb.r + CFG.PLAYER.bodyR * 0.55;
    if (dist2(Bb.x, Bb.y, p.x, p.y) < rb * rb) damagePlayer();
  }
}

      { x:0.50, y:0.32, r:0.80, c0:'rgba(255,90,130,0.34)',  c1:'rgba(255,90,130,0)' },
      { x:0.16, y:0.80, r:0.60, c0:'rgba(255,150,90,0.22)',  c1:'rgba(255,150,90,0)' }
    ],
    edge:'rgba(18,2,8,0.62)', orb:['rgba(255,130,160,', 'rgba(255,190,140,'], dust:'#ffd8e0'
  }
};

var BG = { key:'', canvas:null, orbs:[null, null] };

/* 부드러운 광구 스프라이트를 미리 만들어 두고 재사용한다(매 프레임 그라데이션 생성 방지) */
function makeOrbSprite(rgbaPrefix){
  try {
    var size = 128;
    var c = document.createElement('canvas');
    c.width = size; c.height = size;
    var x = c.getContext('2d');
    var g = x.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    g.addColorStop(0,    rgbaPrefix + '0.55)');
    g.addColorStop(0.42, rgbaPrefix + '0.20)');
    g.addColorStop(1,    rgbaPrefix + '0)');
    x.fillStyle = g;
    x.fillRect(0, 0, size, size);
    return c;
  } catch (e){ return null; }
}

/* 정적인 그라데이션 층은 라운드가 바뀔 때 한 번만 그려 캐시한다 */
function buildBG(theme, key){
  BG.key = key;
  var W = 270, H = 480;
  try {
    var c = document.createElement('canvas');
    c.width = W; c.height = H;
    var x = c.getContext('2d');
    var g = x.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, theme.sky[0]);
    g.addColorStop(0.52, theme.sky[1]);
    g.addColorStop(1, theme.sky[2]);
    x.fillStyle = g;
    x.fillRect(0, 0, W, H);
    for (var i = 0; i < theme.glows.length; i++){
      var gl = theme.glows[i];
      var rg = x.createRadialGradient(gl.x*W, gl.y*H, 0, gl.x*W, gl.y*H, gl.r*W);
      rg.addColorStop(0, gl.c0);
      rg.addColorStop(1, gl.c1);
      x.fillStyle = rg;
      x.fillRect(0, 0, W, H);
    }
    // 좌우 가장자리를 어둡게 해 중앙 전투 영역의 가독성을 높인다
    var eL = x.createLinearGradient(0, 0, W*0.30, 0);
    eL.addColorStop(0, theme.edge); eL.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = eL; x.fillRect(0, 0, W*0.30, H);
    var eR = x.createLinearGradient(W, 0, W*0.70, 0);
    eR.addColorStop(0, theme.edge); eR.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = eR; x.fillRect(W*0.70, 0, W*0.30, H);
    BG.canvas = c;
  } catch (e){ BG.canvas = null; }
  BG.orbs = [makeOrbSprite(theme.orb[0]), makeOrbSprite(theme.orb[1])];
}

function vgrad(c1, c2){
  var g = ctx.createLinearGradient(0, 0, 0, CFG.VH);
  g.addColorStop(0, c1); g.addColorStop(1, c2);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, CFG.VW, CFG.VH);
}
function wrapY(v, span, offset){
  var r = (v % span + span) % span;
  return r - offset;
}

function drawBgElements(theme){
  var t = G.time;
  // 천천히 떠오르는 빛무리
  for (var i = 0; i < G.bgOrbs.length; i++){
    var o = G.bgOrbs[i];
    var y = wrapY(o.y - G.bgScroll * o.sp * 0.05, CFG.VH + 460, 230);
    var x = o.x + Math.sin(t * 0.24 + o.ph) * 26;
    var sp = BG.orbs[o.which];
    ctx.globalAlpha = o.a * (0.72 + 0.28 * Math.sin(t * 0.55 + o.ph));
    if (sp) ctx.drawImage(sp, Math.round(x - o.r), Math.round(y - o.r), o.r * 2, o.r * 2);
    else { ctx.fillStyle = 'rgba(255,255,255,0.05)'; ctx.beginPath(); ctx.arc(x, y, o.r, 0, TAU); ctx.fill(); }
  }
  ctx.globalAlpha = 1;

  // 라운드 4: 흐르는 실 장식
  if (theme.threads){
    ctx.strokeStyle = theme.threads;
    ctx.lineWidth = 2;
    for (var k = 0; k < 5; k++){
      var ox = 40 + k * 115 + Math.sin(t * 0.3 + k) * 22;
      ctx.beginPath();
      ctx.moveTo(ox - 60, -20);
      ctx.quadraticCurveTo(ox + 70, CFG.VH * 0.5, ox - 30, CFG.VH + 20);
      ctx.stroke();
    }
  }

  // 반짝이는 미세 입자
  ctx.fillStyle = theme.dust;
  for (var j = 0; j < G.bgStars.length; j++){
    var s = G.bgStars[j];
    var sy = wrapY(s.y - G.bgScroll * s.sp * 0.05, CFG.VH + 40, 20);
    ctx.globalAlpha = 0.25 + 0.55 * Math.abs(Math.sin(t * 1.6 + s.tw));
    ctx.beginPath();
    ctx.arc(s.x + Math.sin(t * 0.5 + s.tw) * 6, sy, s.s, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawBackground(){
  var r = (G.state === ST.TITLE) ? 5 : G.round;
  var finalPhase = !!(G.boss && G.boss.alive && G.boss.round === 5 && G.boss.phase === 3);
  var key = finalPhase ? 'F' : String(r);
  var theme = BG_THEMES[key] || BG_THEMES[5];
  if (BG.key !== key || !BG.canvas) buildBG(theme, key);

  if (BG.canvas){
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(BG.canvas, 0, 0, CFG.VW, CFG.VH);
    ctx.imageSmoothingEnabled = false;
  } else {
    vgrad(theme.sky[0], theme.sky[2]);   // 캔버스 생성 실패 시 대비
  }
  drawBgElements(theme);
}

/* =========================================================================
   18. 탄환 / 아이템 / 캐릭터 렌더링
   ========================================================================= */
function drawEBullet(b){
  ctx.save();
  ctx.translate(Math.round(b.x), Math.round(b.y));
  if (b.rot) ctx.rotate(b.rot);
  var r = b.r;
  switch (b.type){
    case 'bear':
      ctx.fillStyle = b.color;
      ctx.beginPath(); ctx.arc(-r * 0.62, -r * 0.62, r * 0.42, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(r * 0.62, -r * 0.62, r * 0.42, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
      ctx.fillStyle = b.color2;
      ctx.fillRect(-r * 0.32, r * 0.05, r * 0.64, r * 0.42);
      ctx.fillStyle = '#2a1608';
      ctx.fillRect(-r * 0.52, -r * 0.3, r * 0.26, r * 0.26);
      ctx.fillRect(r * 0.26, -r * 0.3, r * 0.26, r * 0.26);
      ctx.fillRect(-r * 0.1, r * 0.12, r * 0.2, r * 0.16);
      break;
    case 'book':
      ctx.fillStyle = b.color2; ctx.fillRect(-r, -r * 0.78, r * 2, r * 1.56);
      ctx.fillStyle = b.color; ctx.fillRect(-r * 0.86, -r * 0.62, r * 0.78, r * 1.24);
      ctx.fillRect(r * 0.08, -r * 0.62, r * 0.78, r * 1.24);
      ctx.fillStyle = b.color2; ctx.fillRect(-r * 0.06, -r * 0.78, r * 0.12, r * 1.56);
      break;
    case 'page':
      ctx.fillStyle = b.color; ctx.fillRect(-r * 0.8, -r, r * 1.6, r * 2);
      ctx.fillStyle = b.color2;
      ctx.fillRect(-r * 0.5, -r * 0.5, r, 2);
      ctx.fillRect(-r * 0.5, 0, r, 2);
      ctx.fillRect(-r * 0.5, r * 0.5, r * 0.6, 2);
      break;
    case 'bat':
      ctx.fillStyle = b.color2; ctx.fillRect(-r, -r * 0.34, r * 2, r * 0.68);
      ctx.fillStyle = b.color; ctx.fillRect(-r * 0.9, -r * 0.24, r * 1.5, r * 0.48);
      ctx.fillRect(r * 0.5, -r * 0.42, r * 0.5, r * 0.84);
      break;
    case 'baseball':
      ctx.fillStyle = b.color; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
      ctx.strokeStyle = b.color2; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(-r * 0.55, 0, r * 0.85, -0.9, 0.9); ctx.stroke();
      ctx.beginPath(); ctx.arc(r * 0.55, 0, r * 0.85, PI - 0.9, PI + 0.9); ctx.stroke();
      break;
    case 'go':
      // 글자 그대로 이동하도록 회전을 주지 않는다
      ctx.fillStyle = b.color2;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
      ctx.font = 'bold ' + Math.round(r * 2.3) + 'px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 3; ctx.strokeStyle = b.color2;
      ctx.strokeText('ゴ', 0, 1);
      ctx.fillStyle = b.color;
      ctx.fillText('ゴ', 0, 1);
      break;
    case 'string':
      ctx.fillStyle = b.color2; ctx.fillRect(-r * 0.5, -r * 1.4, r, r * 2.8);
      ctx.fillStyle = b.color; ctx.fillRect(-r * 0.3, -r * 1.2, r * 0.6, r * 2.4);
      break;
    case 'paw':
      ctx.fillStyle = b.color2;
      ctx.beginPath(); ctx.arc(0, r * 0.18, r * 0.82, 0, TAU); ctx.fill();
      ctx.fillStyle = b.color;
      ctx.beginPath(); ctx.arc(0, r * 0.18, r * 0.66, 0, TAU); ctx.fill();
      for (var i = 0; i < 4; i++){
        var a = -PI * 0.82 + i * (PI * 0.64 / 3);
        ctx.fillStyle = b.color2;
        ctx.beginPath(); ctx.arc(Math.cos(a) * r * 0.78, Math.sin(a) * r * 0.78 + r * 0.02, r * 0.3, 0, TAU); ctx.fill();
        ctx.fillStyle = b.color;
        ctx.beginPath(); ctx.arc(Math.cos(a) * r * 0.78, Math.sin(a) * r * 0.78 + r * 0.02, r * 0.21, 0, TAU); ctx.fill();
      }
      break;
    case 'toe':
      ctx.fillStyle = b.color2; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
      ctx.fillStyle = b.color; ctx.beginPath(); ctx.arc(0, 0, r * 0.68, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(-r * 0.24, -r * 0.24, r * 0.2, 0, TAU); ctx.fill();
      break;
    case 'big':
      ctx.fillStyle = b.color2; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
      ctx.fillStyle = b.color; ctx.beginPath(); ctx.arc(0, 0, r * 0.72, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.globalAlpha = 0.6;
      ctx.beginPath(); ctx.arc(-r * 0.28, -r * 0.28, r * 0.22, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
      break;
    default: // ball
      ctx.fillStyle = b.color2; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
      ctx.fillStyle = b.color; ctx.beginPath(); ctx.arc(0, 0, r * 0.66, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.globalAlpha = 0.75;
      ctx.beginPath(); ctx.arc(-r * 0.26, -r * 0.26, r * 0.18, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
      break;
  }
  ctx.restore();
}

function drawPBullet(b){
  if (b.kind === 'homing'){
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(Math.atan2(b.vy, b.vx) + PI / 2);
    ctx.fillStyle = '#0a3a4a'; ctx.fillRect(-5, -9, 10, 18);
    ctx.fillStyle = '#8ff0ff'; ctx.fillRect(-3, -7, 6, 14);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(-2, -9, 4, 5);
    ctx.restore();
  } else if (b.kind === 'opt'){
    ctx.fillStyle = '#b0ffd8'; ctx.fillRect(Math.round(b.x) - 2, Math.round(b.y) - 7, 4, 12);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(Math.round(b.x) - 1, Math.round(b.y) - 7, 2, 6);
  } else {
    ctx.fillStyle = '#ffe58a'; ctx.fillRect(Math.round(b.x) - 3, Math.round(b.y) - 9, 6, 16);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(Math.round(b.x) - 2, Math.round(b.y) - 9, 4, 8);
  }
}

function drawItem(it){
  var x = Math.round(it.x), y = Math.round(it.y);
  var bob = Math.sin(it.t * 5) * 2;
  ctx.save();
  if (it.noPick > 0) ctx.globalAlpha = 0.55;   // 아직 회수할 수 없는 상태
  ctx.translate(x, y + bob);
  if (it.type === 'P' || it.type === 'PBIG'){
    var big = (it.type === 'PBIG');
    var sz = big ? 19 : 14;
    if (big){
      // 눈에 잘 띄도록 은은한 발광 테두리를 함께 그린다
      ctx.globalAlpha *= 0.35;
      ctx.fillStyle = '#ff4a5a';
      ctx.fillRect(-sz - 4, -sz - 4, (sz + 4) * 2, (sz + 4) * 2);
      ctx.globalAlpha /= 0.35;
    }
    ctx.fillStyle = big ? '#4a0a14' : '#1a2a4a'; ctx.fillRect(-sz, -sz, sz * 2, sz * 2);
    ctx.fillStyle = big ? '#ff3a4a' : '#4ad8ff'; ctx.fillRect(-(sz - 3), -(sz - 3), (sz - 3) * 2, (sz - 3) * 2);
    ctx.fillStyle = big ? '#7a0c1c' : '#08283a'; ctx.fillRect(-(sz - 5), -(sz - 5), (sz - 5) * 2, (sz - 5) * 2);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold ' + (big ? 24 : 17) + 'px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('P', 0, 1);
  } else {
    var c1 = it.type === 'heart' ? '#ff8ab0' : '#ff3a4a';
    var c2 = it.type === 'heart' ? '#ffd0e0' : '#ff9aa0';
    drawHeartShape(0, 0, 13, c1, c2, '#5a1020');
    if (it.type === 'maxheart'){
      ctx.fillStyle = '#fff36e';
      for (var k = 0; k < 2; k++){
        var oy = 4 - k * 7;
        ctx.beginPath();
        ctx.moveTo(13, -6 + oy); ctx.lineTo(19, 0 + oy); ctx.lineTo(7, 0 + oy);
        ctx.closePath(); ctx.fill();
      }
    }
  }
  ctx.restore();
}

function drawHeartShape(x, y, s, fill, light, outline){
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = outline;
  ctx.beginPath(); ctx.arc(-s * 0.42, -s * 0.22, s * 0.55, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(s * 0.42, -s * 0.22, s * 0.55, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-s * 0.92, -s * 0.02); ctx.lineTo(0, s * 0.96); ctx.lineTo(s * 0.92, -s * 0.02); ctx.closePath(); ctx.fill();
  ctx.fillStyle = fill;
  ctx.beginPath(); ctx.arc(-s * 0.4, -s * 0.24, s * 0.44, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(s * 0.4, -s * 0.24, s * 0.44, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-s * 0.8, -s * 0.04); ctx.lineTo(0, s * 0.8); ctx.lineTo(s * 0.8, -s * 0.04); ctx.closePath(); ctx.fill();
  ctx.fillStyle = light;
  ctx.beginPath(); ctx.arc(-s * 0.42, -s * 0.3, s * 0.18, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawPlayer(){
  var p = G.player;
  if (!p) return;
  if (p.invuln > 0 && Math.floor(p.invuln * 16) % 2 === 0) return;   // 무적 깜빡임
  var bob = Math.sin(p.anim * 7) * 1.5;

  // 보조 발사기
  var offs = optionOffsets();
  for (var i = 0; i < offs.length; i++){
    var ox = p.x + offs[i], oy = p.y + 2 + Math.sin(p.anim * 6 + i) * 2;
    ctx.fillStyle = '#0a3a4a'; ctx.fillRect(Math.round(ox) - 6, Math.round(oy) - 6, 12, 12);
    ctx.fillStyle = '#5fe8c8'; ctx.fillRect(Math.round(ox) - 4, Math.round(oy) - 4, 8, 8);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(Math.round(ox) - 2, Math.round(oy) - 6, 4, 3);
  }

  drawChar('player', p.x, p.y + bob, CFG.ART.playerH, { fallback:'chichi' });

  // 일기장 연출
  if (p.diary){
    ctx.fillStyle = '#8a5a2a'; ctx.fillRect(Math.round(p.x) + 16, Math.round(p.y) - 6, 20, 24);
    ctx.fillStyle = '#f0d488'; ctx.fillRect(Math.round(p.x) + 18, Math.round(p.y) - 4, 16, 20);
    ctx.fillStyle = '#8a5a2a'; ctx.fillRect(Math.round(p.x) + 25, Math.round(p.y) - 4, 2, 20);
  }
}

function drawEnemy(m){
  var sp = SPRITES[m.def.sprite];
  var bob = Math.sin(m.anim * 6) * 1.5;
  drawSprite(ctx, sp, m.x, m.y + bob, m.def.scale * CFG.ART.mobScale, { flash: m.flash > 0 });
}

function drawBoss(){
  var B = G.boss;
  if (!B || !B.alive) return;
  var bob = Math.sin(B.anim * 3) * 3;

  // 최종보스 오라
  if (B.round === 5){
    var aR = 48 + Math.sin(B.anim * 3) * 5;
    ctx.globalAlpha = B.phase === 3 ? 0.4 : 0.22;
    ctx.fillStyle = B.phase === 3 ? '#ff4a7a' : '#8f7fff';
    ctx.beginPath(); ctx.arc(B.x, B.y + bob, aR, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  } else if (B.phase >= 2){
    ctx.globalAlpha = 0.16; ctx.fillStyle = B.def.barColor;
    ctx.beginPath(); ctx.arc(B.x, B.y + bob, 44, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }

  drawChar(B.def.key, B.x, B.y + bob, CFG.ART.bossH, { flash: B.flash > 0, fallback: B.def.sprite });

  // 말풍선 (곰동이 춤!)
  if (B.bubble > 0){
    var bx = B.x, by = B.y - 62;
    var txt = B.bubbleText;
    ctx.font = 'bold 15px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    var w = ctx.measureText(txt).width + 22;
    ctx.fillStyle = 'rgba(10,8,20,0.85)';
    ctx.fillRect(Math.round(bx - w / 2), Math.round(by - 15), Math.round(w), 30);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(Math.round(bx - w / 2), Math.round(by - 15), Math.round(w), 2);
    ctx.fillRect(Math.round(bx - w / 2), Math.round(by + 13), Math.round(w), 2);
    ctx.fillStyle = '#ffe58a';
    ctx.fillText(txt, Math.round(bx), Math.round(by));
    ctx.fillStyle = 'rgba(10,8,20,0.85)';
    ctx.beginPath();
    ctx.moveTo(bx - 8, by + 14); ctx.lineTo(bx + 8, by + 14); ctx.lineTo(bx, by + 24);
    ctx.closePath(); ctx.fill();
  }
}

function drawWarns(){
  for (var i = 0; i < G.warns.length; i++){
    var w = G.warns[i];
    var a = 0.25 + 0.55 * Math.abs(Math.sin(w.t * 18));
    ctx.save();
    ctx.globalAlpha = a;
    ctx.strokeStyle = '#ff5a7a';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(w.x, w.y);
    ctx.lineTo(w.x + Math.cos(w.ang) * 900, w.y + Math.sin(w.ang) * 900);
    ctx.stroke();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawParticles(){
  for (var i = 0; i < G.particles.length; i++){
    var p = G.particles[i];
    var a = Math.max(0, p.life / p.max);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    if (p.kind === 'star'){
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillRect(-p.size, -1, p.size * 2, 2);
      ctx.fillRect(-1, -p.size, 2, p.size * 2);
      ctx.restore();
    } else {
      ctx.fillRect(Math.round(p.x) - p.size / 2, Math.round(p.y) - p.size / 2, p.size, p.size);
    }
  }
  ctx.globalAlpha = 1;
}

function drawTexts(){
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (var i = 0; i < G.texts.length; i++){
    var t = G.texts[i];
    var a = Math.min(1, t.life / (t.max * 0.5));
    ctx.globalAlpha = a;
    ctx.font = 'bold ' + t.size + 'px sans-serif';
    ctx.fillStyle = '#000000';
    ctx.fillText(t.text, t.x + 1, t.y + 1);
    ctx.fillStyle = t.color;
    ctx.fillText(t.text, t.x, t.y);
  }
  ctx.globalAlpha = 1;
}

/* =========================================================================
   19. UI
   ========================================================================= */
function drawJoystick(){
  // 누른 위치에 생성되므로 손가락이 닿아 있을 때만 표시한다
  if (!canUseJoystick() || !JOY.active) return;
  ctx.globalAlpha = 0.34;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(JOY.baseX, JOY.baseY, JOY.maxR, 0, TAU); ctx.fill();
  ctx.globalAlpha = 0.62;
  ctx.fillStyle = '#8ff0ff';
  ctx.beginPath(); ctx.arc(JOY.x, JOY.y, 26, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
}

function drawUI(){
  var top = CFG.SAFE_TOP;
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';

  // 좌측 상단: 점수
  ctx.font = 'bold 13px monospace';
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillText('SCORE', 15, top + 1);
  ctx.fillStyle = '#9fb0d8';
  ctx.fillText('SCORE', 14, top);
  ctx.font = 'bold 20px monospace';
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillText(comma(G.score), 15, top + 15);
  ctx.fillStyle = '#ffffff';
  ctx.fillText(comma(G.score), 14, top + 14);

  // 하트
  var hy = top + 42;
  for (var i = 0; i < G.maxHearts; i++){
    var x = 24 + i * 24;
    if (i < G.hearts) drawHeartShape(x, hy + 8, 10, '#ff5f8a', '#ffd0e0', '#5a1020');
    else {
      ctx.globalAlpha = 0.45;
      drawHeartShape(x, hy + 8, 10, '#3a3446', '#5a5468', '#201a28');
      ctx.globalAlpha = 1;
    }
  }

  // 공격력 단계
  ctx.font = 'bold 13px monospace';
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillText('P Lv.' + G.plv, 15, hy + 23);
  ctx.fillStyle = G.plv >= 9 ? '#ffe58a' : '#8ff0ff';
  ctx.fillText('P Lv.' + G.plv, 14, hy + 22);

  // 중앙 상단: 라운드 / 남은 시간
  if (G.state === ST.WAVE || G.state === ST.WAVE_CLEAR){
    ctx.textAlign = 'center';
    ctx.font = 'bold 14px monospace';
    ctx.fillStyle = '#c8d4f0';
    ctx.fillText('ROUND ' + G.round + ' / ' + CFG.TOTAL_ROUNDS, CFG.VW / 2, top);
    var tRem = Math.max(0, G.waveTimer);
    var urgent = tRem <= 5;
    var jitter = urgent ? Math.sin(G.time * 40) * 2 : 0;
    ctx.font = 'bold ' + (urgent ? 26 : 21) + 'px monospace';
    ctx.fillStyle = urgent ? '#ff6a7a' : '#ffffff';
    ctx.fillText(tRem.toFixed(1), CFG.VW / 2 + jitter, top + 18);
    ctx.font = '10px monospace';
    ctx.fillStyle = '#8f9ac0';
    ctx.fillText('BOSS', CFG.VW / 2, top + 46);
  }

  // 우측 상단: 보스 이름 + 체력바
  var B = G.boss;
  if (B && B.alive && (G.state === ST.BOSS_FIGHT || G.state === ST.BOSS_ENTER || G.state === ST.DIALOG)){
    var bw = 210, bh = 12, bx = CFG.VW - 16 - bw, by = top + 20;
    ctx.textAlign = 'right';
    ctx.font = 'bold 15px sans-serif';
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillText(B.name, CFG.VW - 15, top + 1);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(B.name, CFG.VW - 16, top);
    var ratio = clamp(B.dispHp / B.maxHp, 0, 1);
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(bx - 2, by - 2, bw + 4, bh + 4);
    ctx.fillStyle = '#241c34';
    ctx.fillRect(bx, by, bw, bh);
    var col = ratio > CFG.BOSS_PHASE.p2 ? B.def.barColor : (ratio > CFG.BOSS_PHASE.p3 ? '#ffb03a' : '#ff4a5a');
    ctx.fillStyle = col;
    ctx.fillRect(bx, by, bw * ratio, bh);
    if (B.hitBar > 0){
      ctx.globalAlpha = B.hitBar / 0.18 * 0.8;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(bx, by, bw * ratio, bh);
      ctx.globalAlpha = 1;
    }
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fillRect(bx, by, bw * ratio, 3);
  }
  ctx.textAlign = 'left';
}

/* --------------------------- 대화창 --------------------------- */
function drawDialog(){
  var d = G.dialog;
  if (!d) return;
  var line = d.lines[d.i];
  if (!line) return;
  var bx = 26, bw = CFG.VW - 52, by = 772, bh = 150;

  // 캐릭터 상반신 (프레임 없이 대화창 위에 얹는다)
  drawBust(line.face === 'chichi' ? 'player' : line.face, bx + 92, by + 6, 158);

  // 대화 상자
  ctx.fillStyle = 'rgba(8,6,18,0.92)';
  ctx.fillRect(bx, by, bw, bh);
  ctx.fillStyle = '#8ff0ff';
  ctx.fillRect(bx, by, bw, 3);
  ctx.fillRect(bx, by + bh - 3, bw, 3);

  // 이름
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.font = 'bold 15px sans-serif';
  ctx.fillStyle = '#ffe58a';
  ctx.fillText(line.who, bx + 18, by + 14);

  // 내용 (자동 줄바꿈)
  ctx.font = '17px sans-serif';
  ctx.fillStyle = '#ffffff';
  var maxW = bw - 36;
  var words = line.text.split('');
  var cur = '', lines = [];
  for (var i = 0; i < words.length; i++){
    var test = cur + words[i];
    if (ctx.measureText(test).width > maxW && cur.length > 0){ lines.push(cur); cur = words[i]; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  for (var l = 0; l < lines.length && l < 4; l++){
    ctx.fillText(lines[l], bx + 18, by + 44 + l * 25);
  }

  // 다음 표시
  if (Math.floor(G.time * 2.2) % 2 === 0){
    ctx.fillStyle = '#8ff0ff';
    ctx.beginPath();
    ctx.moveTo(bx + bw - 26, by + bh - 24);
    ctx.lineTo(bx + bw - 14, by + bh - 24);
    ctx.lineTo(bx + bw - 20, by + bh - 14);
    ctx.closePath(); ctx.fill();
  }
}

/* --------------------------- 타이틀 / 배너 / 팝업 --------------------------- */
function drawTitle(){
  var cy = 300;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  ctx.font = 'bold 42px sans-serif';
  var wobble = Math.sin(G.time * 2) * 4;
  ctx.fillStyle = '#2a1a3a';
  ctx.fillText(CFG.TITLE, CFG.VW / 2 + 3, cy + 3 + wobble);
  ctx.fillStyle = '#ffe58a';
  ctx.fillText(CFG.TITLE, CFG.VW / 2, cy + wobble);

  ctx.font = 'bold 13px monospace';
  ctx.fillStyle = '#8ff0ff';
  ctx.fillText(CFG.SUBTITLE, CFG.VW / 2, cy + 44 + wobble);

  var bob = Math.sin(G.time * 4) * 6;
  drawChar('player', CFG.VW / 2, 560 + bob, CFG.ART.titleH, { fallback:'chichi' });

  if (Math.floor(G.time * 1.8) % 2 === 0){
    ctx.font = 'bold 20px sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.fillText(CFG.TAP_TO_START, CFG.VW / 2, 760);
  }
}

function drawRoundBanner(){
  if (G.state !== ST.ROUND_START) return;
  var t = 1 - G.stateT / 1.7;
  var a = t < 0.15 ? t / 0.15 : (t > 0.82 ? (1 - t) / 0.18 : 1);
  ctx.globalAlpha = clamp(a, 0, 1);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(6,4,14,0.6)';
  ctx.fillRect(0, 400, CFG.VW, 130);
  ctx.font = 'bold 52px monospace';
  ctx.fillStyle = '#ffe58a';
  ctx.fillText('ROUND ' + G.round, CFG.VW / 2, 465);
  ctx.globalAlpha = 1;
}

function drawBossEnterFx(){
  if (G.state !== ST.BOSS_ENTER || !G.boss) return;
  var B = G.boss;
  // 화면 가장자리 경고
  var a = 0.25 + 0.25 * Math.abs(Math.sin(G.stateT * 7));
  ctx.globalAlpha = a;
  ctx.fillStyle = '#ff3a5a';
  ctx.fillRect(0, 0, CFG.VW, 8); ctx.fillRect(0, CFG.VH - 8, CFG.VW, 8);
  ctx.fillRect(0, 0, 8, CFG.VH); ctx.fillRect(CFG.VW - 8, 0, 8, CFG.VH);
  ctx.globalAlpha = 1;
  if (G.stateT > 1.5){
    var t = (G.stateT - 1.5) / 1.4;
    ctx.globalAlpha = clamp(t < 0.2 ? t / 0.2 : (t > 0.8 ? (1 - t) / 0.2 : 1), 0, 1);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(6,4,14,0.65)';
    ctx.fillRect(0, 420, CFG.VW, 110);
    ctx.font = 'bold 18px monospace';
    ctx.fillStyle = '#ff6a8a';
    ctx.fillText('WARNING', CFG.VW / 2, 452);
    ctx.font = 'bold 42px sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.fillText(B.name, CFG.VW / 2, 492);
    ctx.globalAlpha = 1;
  }
}

function drawGameOver(){
  ctx.fillStyle = 'rgba(4,2,10,0.72)';
  ctx.fillRect(0, 0, CFG.VW, CFG.VH);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 54px monospace';
  ctx.fillStyle = '#ff4a6a';
  ctx.fillText('GAME OVER', CFG.VW / 2, 380);
  ctx.font = 'bold 20px monospace';
  ctx.fillStyle = '#ffffff';
  ctx.fillText('SCORE  ' + comma(G.score), CFG.VW / 2, 460);
  ctx.fillText('ROUND  ' + G.reachedRound + ' / ' + CFG.TOTAL_ROUNDS, CFG.VW / 2, 496);
  if (G.stateT > CFG.POPUP_DELAY && Math.floor(G.time * 1.8) % 2 === 0){
    ctx.font = 'bold 18px sans-serif';
    ctx.fillStyle = '#c8d4f0';
    ctx.fillText(CFG.TAP_TO_TITLE, CFG.VW / 2, 600);
  }
}

function drawClear(){
  ctx.fillStyle = 'rgba(4,2,10,0.6)';
  ctx.fillRect(0, 0, CFG.VW, CFG.VH);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 52px monospace';
  var w = Math.sin(G.time * 3) * 5;
  ctx.fillStyle = '#ffe58a';
  ctx.fillText('GAME CLEAR!', CFG.VW / 2, 300 + w);
  ctx.font = 'bold 20px monospace';
  ctx.fillStyle = '#ffffff';
  ctx.fillText('SCORE  ' + comma(G.score), CFG.VW / 2, 388);
  ctx.fillText('HEART  ' + G.hearts + ' / ' + G.maxHearts, CFG.VW / 2, 422);
  ctx.fillText('POWER  Lv.' + G.plv, CFG.VW / 2, 456);
  var jump = Math.abs(Math.sin(G.time * 5)) * 22;
  drawChar('player', CFG.VW / 2, 590 - jump, CFG.ART.clearH, { fallback:'chichi' });
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.beginPath(); ctx.ellipse(CFG.VW / 2, 640, 40, 8, 0, 0, TAU); ctx.fill();
  if (G.stateT > CFG.POPUP_DELAY && Math.floor(G.time * 1.8) % 2 === 0){
    ctx.font = 'bold 18px sans-serif';
    ctx.fillStyle = '#c8d4f0';
    ctx.fillText(CFG.TAP_TO_TITLE, CFG.VW / 2, 760);
  }
}

/* =========================================================================
   20. 메인 업데이트 루프
   ========================================================================= */
function updatePlay(dt, allowAction){
  updatePlayer(dt, true);
  if (allowAction) playerFire(dt);
  updatePBullets(dt);
  updateEnemies(dt, allowAction);
  updateEBullets(dt);
  updateItems(dt);
  collide();
}

function updateWave(dt){
  G.waveTimer -= dt;
  var elapsed = CFG.WAVE_TIME - G.waveTimer;

  if (G.waveTimer > 1.2){
    G.spawnT -= dt;
    if (G.spawnT <= 0 && G.enemies.length < CFG.ROUND.maxEnemies[G.round]){
      G.spawnT = CFG.ROUND.spawnEvery[G.round] * rnd(0.85, 1.2);
      var n = CFG.ROUND.spawnCount[G.round];
      for (var i = 0; i < n; i++) spawnMob();
    }
  }
  // P아이템: 라운드마다 1개는 확정 등장시켜 공격력 성장의 하한을 보장한다
  if (!G.bigPDropped && elapsed >= CFG.DROP.guaranteedPElapsed){
    G.bigPDropped = true;
    var bx = G.player ? clamp(G.player.x, 90, CFG.VW - 90) : CFG.VW / 2;
    addItem(bx, 50, 'P');
  }
  // 최대 하트 아이템: 라운드 중반 1회, 획득 가능한 위치
  if (!G.maxHeartDropped && elapsed >= CFG.DROP.maxHeartElapsed && G.maxHearts < CFG.PLAYER.maxHeartsCap){
    G.maxHeartDropped = true;
    var px = G.player ? clamp(G.player.x, 90, CFG.VW - 90) : CFG.VW / 2;
    addItem(px, 60, 'maxheart');
    addText(px, 100, '♥ MAX UP', '#ff8aa0', 15, 1.2);
  }
  if (G.waveTimer <= 0){
    G.waveTimer = 0;
    enterWaveClear();
  }
}

function update(dt){
  G.time += dt;
  G.bgScroll += dt * 20;
  if (input.tapLock > 0) input.tapLock -= dt;
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 26);
  if (G.flash > 0) G.flash = Math.max(0, G.flash - dt * 2.6);
  if (G.powerText > 0) G.powerText -= dt;
  if (SND.hitT > 0) SND.hitT -= dt;
  updateParticles(dt);

  switch (G.state){
    case ST.TITLE:
      if (consumeTap()) startGame();
      break;

    case ST.ROUND_START:
      G.stateT -= dt;
      if (G.stateT <= 0) enterWave();
      break;

    case ST.WAVE:
      updatePlay(dt, true);
      if (G.state === ST.WAVE) updateWave(dt);
      break;

    case ST.WAVE_CLEAR:
      updatePlay(dt, false);
      G.stateT -= dt;
      if (G.stateT <= 0 && G.state === ST.WAVE_CLEAR) enterBoss();
      break;

    case ST.BOSS_ENTER:
      updatePlayer(dt, true);
      updatePBullets(dt);
      updateBossEnter(dt);
      break;

    case ST.DIALOG:
      updateDialog(dt);
      break;

    case ST.BOSS_FIGHT:
      updatePlay(dt, true);
      if (G.state === ST.BOSS_FIGHT) updateBossFightLogic(dt);
      break;

    case ST.BOSS_DEATH:
      updatePlayer(dt, true);
      updatePBullets(dt);
      G.stateT -= dt;
      if (G.stateT <= 0 && G.state === ST.BOSS_DEATH) afterBossDeath();
      break;

    case ST.ROUND_CLEAR:
      G.stateT -= dt;
      if (G.stateT <= 0 && G.state === ST.ROUND_CLEAR) startRound(G.round + 1);
      break;

    case ST.CLEAR:
    case ST.GAMEOVER:
      G.stateT += dt;
      if (G.stateT > CFG.POPUP_DELAY && consumeTap()) toTitle();
      break;
  }
  input.tap = false;
}

/* =========================================================================
   21. 메인 렌더링 루프
   ========================================================================= */
function render(){
  ctx.fillStyle = '#0b0a18';
  ctx.fillRect(0, 0, CFG.VW, CFG.VH);

  ctx.save();
  if (G.shake > 0){
    ctx.translate(rnd(-G.shake, G.shake), rnd(-G.shake, G.shake));   // 렌더링에만 흔들림 적용
  }

  drawBackground();

  if (G.state === ST.TITLE){
    drawTitle();
  } else {
    drawWarns();
    for (var i = 0; i < G.items.length; i++) drawItem(G.items[i]);
    for (var e = 0; e < G.enemies.length; e++) drawEnemy(G.enemies[e]);
    drawBoss();
    for (var p = 0; p < G.pbullets.length; p++) drawPBullet(G.pbullets[p]);
    drawPlayer();
    for (var b = 0; b < G.ebullets.length; b++) drawEBullet(G.ebullets[b]);
    drawParticles();
    drawTexts();
  }
  ctx.restore();

  if (G.flash > 0){
    ctx.fillStyle = 'rgba(' + G.flashColor + ',' + (G.flash * 0.5).toFixed(3) + ')';
    ctx.fillRect(0, 0, CFG.VW, CFG.VH);
  }

  if (G.state !== ST.TITLE){
    drawUI();
    drawJoystick();
    drawRoundBanner();
    drawBossEnterFx();
    if (G.state === ST.DIALOG) drawDialog();
    if (G.state === ST.GAMEOVER) drawGameOver();
    if (G.state === ST.CLEAR) drawClear();
  }
}

/* =========================================================================
   22. 부팅 / 게임 루프
   ========================================================================= */
var lastTime = 0, running = false;

function frame(now){
  if (!running) return;
  var dt = (now - lastTime) / 1000;
  lastTime = now;
  if (!(dt > 0)) dt = 0;
  if (dt > CFG.MAX_DT) dt = CFG.MAX_DT;     // 탭 복귀 시 시간 점프 방지
  if (G.slowmo > 0){ G.slowmo -= dt; dt *= 0.4; }
  try { update(dt); } catch (err) { if (window.console) console.error(err); }
  try { render(); } catch (err2) { if (window.console) console.error(err2); }
  requestAnimationFrame(frame);
}

document.addEventListener('visibilitychange', function(){
  if (!document.hidden){
    lastTime = (window.performance && performance.now) ? performance.now() : Date.now();
    releaseJoystick();
    input.tap = false;
  }
});
window.addEventListener('blur', function(){ releaseJoystick(); });

function boot(){
  resize();
  loadImages();
  initAudio();
  makeStars();
  toTitle();
  running = true;
  lastTime = (window.performance && performance.now) ? performance.now() : Date.now();
  requestAnimationFrame(frame);
}
boot();

/* 디버그 핸들 (자동 검증용) */
window.__GAME = {
  G:G, ST:ST, CFG:CFG, update:update, render:render, input:input,
  startGame:startGame, startRound:startRound, toTitle:toTitle, JOY:JOY,
  tap:function(){ input.tap = true; input.tapLock = 0; },
  IMG:IMG, IMG_DATA:IMG_DATA, SND:SND, BG:BG, BG_THEMES:BG_THEMES,
  step:function(dt){ update(dt); render(); }
};

})();
</script>
