<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>지하로 내려갑니다</title>
<style>
  :root{ --brass:#8a6a34; --brass-hi:#c9a15a; --gold:#f0c04a; --red:#d4453a; --green:#7ce0b0; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;background:#070b0e;overflow:hidden;
    font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",-apple-system,sans-serif;
    -webkit-user-select:none;user-select:none}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #frame{width:390px;height:844px;position:relative;overflow:hidden;background:#0c141a;
    transform-origin:center center;box-shadow:0 0 60px #000}
  #cv{display:block;width:390px;height:844px;image-rendering:pixelated}

  #hud{position:absolute;left:0;top:0;width:100%;padding:7px 10px 6px;color:#e8e2d2;
    pointer-events:none;background:linear-gradient(#0a1015f2,#0a1015cc 70%,#0a101500)}
  .hrow{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:800}
  #hGold{color:var(--gold)}
  #mult{color:var(--green);font-size:11px;margin-left:5px}
  .bar{display:flex;align-items:center;gap:6px;margin-top:4px}
  .bar .lbl{font-size:10px;color:#8fa3ad;width:24px}
  .track{flex:1;height:11px;background:#1a262d;border:1px solid #33454f;position:relative;overflow:hidden}
  #hpFill{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(#e8635a,#a82a22);transition:width .16s}
  #hpNum{font-size:10px;color:#cfd8dc;min-width:54px;text-align:right}
  .hrow2{display:flex;gap:6px;margin-top:5px;pointer-events:auto}
  #nextInfo{flex:1;text-align:left;font-family:inherit;font-size:10.5px;line-height:1.3;
    background:#12202688;border:1px solid #2c3f49;color:#b9c9d1;padding:4px 7px;border-radius:2px;cursor:pointer}
  #nextInfo b{color:#fff}
  #comboBtn{font-family:inherit;font-size:10.5px;background:#1a2a22;border:1px solid #2f5a44;
    color:var(--green);padding:4px 8px;border-radius:2px;cursor:pointer;white-space:nowrap}

  #bottom{position:absolute;left:0;bottom:0;width:100%;height:112px;padding:7px 10px 9px;
    display:flex;flex-direction:column;justify-content:flex-end;gap:6px;
    background:linear-gradient(#0a101500,#0a1015e6 30%);color:#cfd8dc}
  #msg{flex:0 0 auto;width:100%;max-height:48px;overflow-y:auto;line-height:1.35;font-size:11px;
    -webkit-overflow-scrolling:touch}
  #msg:empty{display:none}
  .btn{touch-action:manipulation;border:2px solid var(--brass);background:#1b2830;color:#f2e6c8;font-family:inherit;
    font-size:13px;font-weight:800;padding:12px 13px;border-radius:2px;cursor:pointer}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--brass);color:#1a1208;border-color:var(--brass-hi)}
  .btn.ghost{border-color:#3d4c55;color:#8fa3ad;background:#131c22;font-weight:500}
  .btn.tiny{font-size:9.5px;padding:9px 2px;line-height:1.2;font-weight:700}
  .btn.tiny b{display:block;font-size:10.5px}
  #acts{display:flex;gap:5px;align-items:stretch;width:100%}
  #acts .btn{flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:2px;padding-right:2px}
  #acts .btn.primary{flex:1.35 1 0;font-size:12.5px;padding:11px 4px}
  #acts .btn:only-child{flex:0 0 auto;padding-left:16px;padding-right:16px}
  #acts #btnFast[hidden]{display:none!important}
  #acts #btnFast{flex:0 0 52px;width:52px;height:52px;margin-left:auto;padding:0;
    font-size:9px;line-height:1.2;display:flex;flex-direction:column;align-items:center;justify-content:center}
  #acts #btnFast b{display:block;font-size:13px;margin-top:1px}
  #acts .btn.dim{opacity:.42}
  #exitBtn{font-family:inherit;font-size:10.5px;background:#2a1a1a;border:1px solid #5a2f2f;color:#e08a8a;padding:4px 8px;border-radius:2px;cursor:pointer;white-space:nowrap}
  .btn[hidden]{display:none}
  [hidden]{display:none!important}

  #toast{position:absolute;left:0;top:292px;width:100%;text-align:center;font-size:25px;font-weight:900;
    color:#fff;text-shadow:0 3px 0 #000,0 0 18px #000;pointer-events:none;opacity:0;transition:opacity .18s}
  #toast small{display:block;font-size:11.5px;font-weight:600;margin-top:6px;color:#ffe6a8}
  #tip{position:absolute;left:0;top:360px;width:100%;text-align:center;font-size:11px;color:#ffe6a8;
    text-shadow:0 2px 0 #000;pointer-events:none;opacity:0;transition:opacity .2s}

  .panel{position:absolute;left:16px;right:16px;background:#101a20f7;border:2px solid var(--brass);
    padding:13px;color:#e6ecef;font-size:12px;display:none;z-index:7}
  #popup{bottom:120px}
  #comboPanel,#keepPanel{bottom:120px;max-height:400px;overflow:auto}
  .keeprow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #23343d}
  .keeprow span{flex:1;font-size:11.5px}
  .pname{font-size:15px;font-weight:900;margin-bottom:3px}
  .tags{display:flex;flex-wrap:wrap;gap:4px;margin:5px 0 7px}
  .tag{font-size:9.5px;padding:2px 6px;border:1px solid #3a4d57;color:#9fb4bd;border-radius:2px}
  .atkline{color:var(--gold);font-weight:800;margin-bottom:5px;font-size:13px}
  .desc{color:#a9bcc5;line-height:1.5;margin-bottom:9px}
  .row{display:flex;gap:7px}
  .cmb{border-left:3px solid var(--green);padding:4px 0 4px 8px;margin-bottom:7px}
  .cmb b{color:var(--green);font-size:12px}
  .cmb span{display:block;color:#93a6af;font-size:10.5px;margin-top:2px;line-height:1.4}
  .cmb.locked{border-color:#33454f}
  .cmb.locked b{color:#5f7480}

  #modal{position:absolute;inset:0;background:#050a0de8;display:none;z-index:9;
    flex-direction:column;align-items:center;justify-content:center;padding:16px;color:#e6ecef}
  #modalCard{width:100%;max-height:100%;overflow:auto;border:2px solid var(--brass);background:#101a20;padding:18px;text-align:center}
  #modal h2{margin:0 0 3px;font-size:19px;font-weight:900;color:#f2e6c8}
  #modal .sub{font-size:11px;color:#8fa3ad;margin-bottom:12px}
  #modal .big{font-size:29px;font-weight:900;color:var(--gold);margin:2px 0 3px}
  #modal .line{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;
    color:#a9bcc5;padding:6px 0;border-bottom:1px solid #23343d;text-align:left;gap:8px}
  #modal .line b{color:#e6ecef}
  #modal .acts{display:flex;flex-direction:column;gap:9px;margin-top:15px}
  #modal .acts .btn{width:100%;padding:13px}
  /* 타이틀 배경: 가운데 고정 · 비율 유지 · 세로를 꽉 채움(좌우는 기기에 따라 잘릴 수 있음) */

<script>
/* =========================================================================
   지하로 내려갑니다 (DESCENT) v2 — 단일 파일 / 외부 에셋 없음
   ========================================================================= */
const W=390,H=844;
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const fmt=n=>Math.round(n).toLocaleString();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function fit(){
  const dpr=Math.min(window.devicePixelRatio||1,3);
  cv.width=W*dpr; cv.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.imageSmoothingEnabled=false;
  $('frame').style.transform='scale('+Math.min(window.innerWidth/W,window.innerHeight/H)+')';
}
window.addEventListener('resize',fit);

/* ---------------------------- 사운드 ---------------------------- */
let AC=null, muted=false;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return AC; }
function beep(f,d,t,v,sl){
  if(muted) return; const a=ac(); if(!a) return;
  try{ const o=a.createOscillator(), g=a.createGain();
    o.type=t||'square'; o.frequency.setValueAtTime(f,a.currentTime);
    if(sl) o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sl),a.currentTime+d);
    g.gain.setValueAtTime(v||.045,a.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+d);
  }catch(e){}
}
const SFX={
  ding(){beep(1318,.12,'sine',.06);setTimeout(()=>beep(988,.28,'sine',.05),120);},
  coin(){beep(880,.07,'square',.04,320);},
  hit(){beep(200,.07,'square',.04,-130);},
  crit(){beep(320,.12,'square',.055,-200);},
  door(){beep(90,.32,'sawtooth',.028,50);},
  sel(){beep(660,.05,'square',.04);},
  board(){beep(440,.09,'square',.045,220);},
  hurt(){beep(150,.3,'sawtooth',.06,-90);},
  heal(){beep(700,.14,'sine',.045,420);},
  combo(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.13,'square',.05),i*80));},
  win(){[523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>beep(f,.12,'square',.05),i*85));},
  lose(){[392,330,262,196].forEach((f,i)=>setTimeout(()=>beep(f,.26,'sawtooth',.06),i*180));}
};

/* ---------------------------- 스프라이트 빌더 ---------------------------- */
function grid(){ const g=[]; for(let r=0;r<16;r++) g.push('............'.split('')); return g; }
function px(g,r,c,ch){ if(r<0||r>15||c<0||c>11) return; g[r][c]=ch; }
function box(g,r0,r1,c0,c1,ch){ for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++) px(g,r,c,ch); }

function BS(cfg){
  const g=grid(), b=cfg.b||'slim';
  const S='s',Cc='c',D='d',G='g',E='e';
  const off=(b==='small')?6:0;
  const hb=(r0,r1,c0,c1,ch)=>box(g,r0+off,r1+off,c0,c1,ch);
  const hp=(r,c,ch)=>px(g,r+off,c,ch);

  if(b==='small'){
    box(g,10,13,2,9,Cc); box(g,9,9,3,8,Cc);
    px(g,8,3,Cc); px(g,8,8,Cc); px(g,9,2,D); px(g,9,9,D);
    px(g,11,3,E); px(g,11,8,E);
    box(g,14,14,2,3,D); box(g,14,14,8,9,D);
    px(g,12,10,G); px(g,11,11,G); px(g,10,11,G);
  } else if(b==='blob'){
    box(g,4,5,4,7,Cc); box(g,6,7,2,9,Cc); box(g,8,12,1,10,Cc); box(g,13,13,2,9,D);
    box(g,8,9,3,4,'w'); box(g,8,9,7,8,'w'); px(g,9,3,E); px(g,9,8,E);
  } else if(b==='ghost'){
    box(g,3,6,3,8,Cc); box(g,7,11,2,9,Cc);
    px(g,12,2,Cc); px(g,12,4,Cc); px(g,12,6,Cc); px(g,12,8,Cc);
    px(g,5,4,E); px(g,5,7,E);
  } else {
    box(g,3,6,3,8,S); px(g,5,4,E); px(g,5,7,E);
    if(b==='robe'){
      box(g,7,7,4,7,Cc); box(g,8,11,3,8,Cc); box(g,12,14,2,9,Cc); box(g,14,14,2,9,D);
      box(g,8,9,2,2,Cc); box(g,8,9,9,9,Cc);
    } else if(b==='wide'){
      box(g,7,7,2,9,Cc); box(g,8,11,3,8,Cc);
      box(g,8,10,2,2,D); box(g,8,10,9,9,D);
      box(g,12,14,3,4,D); box(g,12,14,7,8,D);
    } else {
      box(g,7,11,4,7,Cc); box(g,7,9,3,3,D); box(g,7,9,8,8,D);
      box(g,12,14,4,5,D); box(g,12,14,6,7,D);
    }
  }

  const h=cfg.h;
  if(h==='hair'){ hb(2,3,3,8,D); }
  else if(h==='helm'){ hb(2,3,3,8,G); hb(5,5,3,8,'k'); hp(5,4,E); hp(5,7,E); hb(4,4,3,3,G); hb(4,4,8,8,G); }
  else if(h==='plume'){ hb(2,3,3,8,G); hb(5,5,3,8,'k'); hp(5,4,E); hp(5,7,E); hb(0,1,5,6,'a'); }
  else if(h==='hood'){ hb(2,3,2,9,G); hb(4,6,2,3,G); hb(4,6,8,9,G); hb(4,4,4,7,G); }
  else if(h==='pointy'){ hp(0,5,G); hp(0,6,G); hb(1,1,4,7,G); hb(2,2,3,8,G); hb(3,3,2,9,G); }
  else if(h==='tophat'){ hb(0,1,4,7,G); hb(2,2,3,8,G); hb(3,3,2,9,G); }
  else if(h==='turban'){ hb(1,2,3,8,G); hp(2,2,G); hp(2,9,G); }
  else if(h==='cap'){ hb(2,2,3,8,G); hp(3,2,G); hp(3,9,G); }
  else if(h==='crown'){ if(b!=='small') hb(2,3,3,8,D); hb(1,1,3,8,'a'); hp(0,3,'a'); hp(0,5,'a'); hp(0,8,'a'); }
  else if(h==='halo'){ hb(2,3,3,8,D); hb(1,1,4,7,'a'); }
  else if(h==='horn'){ hb(2,3,3,8,D); hp(1,2,'a'); hp(2,2,'a'); hp(1,9,'a'); hp(2,9,'a'); hp(0,2,'a'); hp(0,9,'a'); }
  else if(h==='skull'){ hb(3,6,3,8,'w'); hb(2,2,3,8,'w'); hp(5,4,'k'); hp(5,7,'k'); hp(6,5,'k'); hp(6,6,'k'); }
  else if(h==='jester'){ hp(0,3,'a'); hp(1,3,G); hp(0,8,'a'); hp(1,8,G); hb(2,2,3,8,G); hb(1,1,4,7,G); }

  const w=cfg.w;
  if(w==='sword'){ box(g,3,9,10,10,'w'); box(g,10,10,9,11,G); px(g,11,10,'k'); }
  else if(w==='spear'){ box(g,1,13,10,10,'k'); box(g,0,1,10,10,'w'); px(g,2,9,'w'); px(g,2,11,'w'); }
  else if(w==='bow'){ box(g,3,11,11,11,G); box(g,4,10,10,10,G); px(g,2,10,G); px(g,12,10,G); box(g,6,8,9,9,'w'); }
  else if(w==='staff'){ box(g,4,14,10,10,'k'); box(g,2,3,9,11,'a'); px(g,1,10,'a'); }
  else if(w==='wand'){ box(g,6,11,10,10,'k'); box(g,4,5,10,10,'a'); }
  else if(w==='dagger'){ box(g,7,10,10,10,'w'); box(g,11,11,9,11,G); }
  else if(w==='axe'){ box(g,3,11,10,10,'k'); box(g,1,4,9,11,'w'); px(g,2,8,'w'); px(g,3,8,'w'); }
  else if(w==='shield'){ box(g,7,11,9,10,G); box(g,9,9,9,10,'a'); }
  else if(w==='bag'){ box(g,9,12,9,11,'a'); px(g,8,10,'k'); }
  else if(w==='book'){ box(g,8,10,9,11,'a'); box(g,9,9,9,11,'w'); }
  else if(w==='scythe'){ box(g,2,13,10,10,'k'); box(g,1,1,7,10,'w'); px(g,2,7,'w'); }
  else if(w==='coin'){ box(g,9,10,10,11,'a'); }
  else if(w==='flag'){ box(g,2,13,10,10,'k'); box(g,2,5,8,9,'a'); }

  if(cfg.wings){ box(g,7,10,0,1,'a'); box(g,7,10,10,11,'a'); px(g,6,0,'a'); px(g,6,11,'a'); }

  const pal={ s:cfg.s||'#e8c49a', c:cfg.c||'#4a5a68', d:cfg.d||'#2c3844',
              g:cfg.g||'#8a8f99', e:cfg.e||'#20242a', w:'#eef2f6', k:'#1a1f24', a:cfg.a||'#f0c04a' };
  return { pal, rows:g.map(r=>r.join('')) };
}

/* 모든 캐릭터(승객·후보·몬스터) 공통 크기 배율 */
const SPRITE_SCALE=1.15;
function drawSprite(sp,cx,footY,scale,opt,g2){
  const G=g2||ctx; opt=opt||{};
  const sc=scale*SPRITE_SCALE;
  const p=4*sc, w=12*p, h=16*p;
  const x0=Math.round(cx-w/2), y0=Math.round(footY-h);
  if(opt.shadow!==false){
    G.globalAlpha=.3; G.fillStyle='#000';
    G.beginPath(); G.ellipse(cx,footY-2,15*sc,4.5*sc,0,0,Math.PI*2); G.fill();
    G.globalAlpha=1;
  }
  const img=sp.pid&&PAX_IMG[sp.pid];
  if(img&&img.complete&&img.naturalWidth){
    /* 캔버스 여백을 제외한 실제 내용만 사용.
       내용 높이를 기준 높이에 맞추고 가로는 원본 비율 그대로 → 크기·발끝 정렬이 통일된다. */
    const t=img.trim||[0,0,img.naturalWidth,img.naturalHeight];
    const ih=h*IMG_CONTENT_RATIO*(img.mul||1), k=ih/t[3], iw=t[2]*k;
    const ix=Math.round(cx-iw/2), iy=Math.round(footY-ih);
    G.drawImage(img,t[0],t[1],t[2],t[3],ix,iy,iw,ih);
    if(opt.tint){
      G.save(); G.globalAlpha=opt.tintA||.5; G.fillStyle=opt.tint;
      G.beginPath(); G.rect(ix,iy,iw,ih);
      G.globalCompositeOperation='source-atop'; G.fill(); G.restore();
    }
    return;
  }
  const pal=sp.pal;
  for(let r=0;r<16;r++){ const row=sp.rows[r];
    for(let c=0;c<12;c++){ const ch=row[c]; if(ch==='.') continue;
      G.fillStyle=pal[ch]||'#f0f'; G.fillRect(x0+c*p,y0+r*p,Math.ceil(p),Math.ceil(p)); } }
  if(opt.tint){
    G.globalAlpha=opt.tintA||.5; G.fillStyle=opt.tint;
    for(let r=0;r<16;r++){ const row=sp.rows[r];
      for(let c=0;c<12;c++){ if(row[c]==='.') continue;
        G.fillRect(x0+c*p,y0+r*p,Math.ceil(p),Math.ceil(p)); } }
    G.globalAlpha=1;
  }
}

function paxTags(p){ return (p.id==='trick'&&p.wild)? DEFS[p.id].tags.concat(DEFS[p.wild].tags) : p.def.tags; }
function paxIds(p){ return (p.id==='trick'&&p.wild)? [p.id,p.wild] : [p.id]; }

/* 현재 탑승 구성에서 활성화되는 조합 id 집합 */
function activeComboIds(pax){
  const cnt={},tagN={},tagSet={};
  pax.forEach(p=>{
    paxIds(p).forEach(i=>{ cnt[i]=(cnt[i]||0)+1;
      DEFS[i].tags.forEach(t=>{ (tagSet[t]=tagSet[t]||{})[i]=1; }); });
    paxTags(p).forEach(t=>{ tagN[t]=(tagN[t]||0)+1; });
  });
  const C={ n:id=>cnt[id]||0, tag:t=>tagN[t]||0,
            hasTag:(p,t)=>paxTags(p).indexOf(t)>=0,
            distinctTag:t=>Object.keys(tagSet[t]||{}).length,
            pax, cap:run.capacity, empties:Math.max(0,run.capacity-pax.length),
            T:{}, each:()=>{} };
  const out={};
  COMBOS.forEach(cb=>{ try{ if(cb.test(C)) out[cb.id]=1; }catch(e){} });
  return out;
}
/* 사기꾼: 한 명만 더 있으면 완성되는 조합이 있으면 그 직업인 척한다.
   후보가 여럿이면 무작위. 없으면 변장하지 않는다. */
let trickAmbig=false;
function assignTrickWilds(){
  trickAmbig=false;
  const tricks=run.pax.filter(p=>p.id==='trick');
  if(!tricks.length) return;
  tricks.forEach(t=>{
    const cur=t.wild;
    t.wild=null;
    const base=activeComboIds(run.pax);
    const opts=[];
    for(let i=0;i<ORDER.length;i++){
      const id=ORDER[i]; if(id==='trick'||DEFS[id].rar>=3) continue;
      t.wild=id;
      const now=activeComboIds(run.pax);
      let gain=false;
      for(const k in now){ if(!base[k]){ gain=true; break; } }
      if(gain) opts.push(id);
    }
    if(opts.length>1) trickAmbig=true;
    /* 예측 중에는 무작위 재추첨을 하지 않는다 — 같은 상황이면 항상 같은 값이 나오도록 */
    t.wild = opts.length ? (opts.indexOf(cur)>=0 ? cur : (predicting ? opts[0] : pick(opts))) : null;
  });
}
function dmgType(p){ const t=paxTags(p);

/* 대사 출력: 한 줄씩, 탭하면 다음. pos = 'center' | 'bottom' */
/* opt.holdLast: 마지막 줄에서 대화창을 닫지 않고 유지한다.
   이때 promise 는 '마지막 줄이 표시된 시점'에 resolve 되고,
   조작이 가능해지며(tutClose 로 외부에서 닫음) 탭은 캔버스로 통과한다. */
function tutSay(lines,pos,opt){
  opt=opt||{};
  return new Promise(res=>{
    const layer=$('tutLayer'), box=$('tutBox'), nx=$('tutNx');
    box.className=(pos==='bottom')?'bottom':'center';
    layer.style.display='block'; layer.style.pointerEvents='auto';
    tut.talking=true; nx.style.display='';
    drawCrowFace();
    let i=0, done=false;
    const show=()=>{
      $('tutTx').textContent=lines[i];
      if(opt.holdLast&&i===lines.length-1){
        tut.talking=false; nx.style.display='none';
        layer.style.pointerEvents='none';
        if(!done){ done=true; res(); }
      }
    };
    show();
    const step=()=>{
      if(opt.holdLast&&i>=lines.length-1) return;
      SFX.sel(); i++;
      if(i>=lines.length){ tutClose(); if(!done){ done=true; res(); } }
      else show();
    };
    layer._go=step;
  });
}
function tutClose(){
  const layer=$('tutLayer');
  layer.style.display='none'; layer.style.pointerEvents='auto';
  layer._go=null; tut.talking=false;
}

function computeStats(){
  const T={atk:0,preempt:0,burn:0,def:0,mAtkMul:1,mItv:0,heal:0,goldMul:1,floorGold:0,
           killGold:0,battleMul:1,unstable:false,mercCost:0,mercFree:false,execPct:0,
           summonX:1,extraCand:0,wild:false,jackpot:false,luckyJester:false,postDmg:0,
           combos:[],foresee:false,regen:0,cookRegen:0,atkItv:1,poisonPct:0,heraldN:0,
           shadowRate:0.8,archmage:false,pactN:0,pactExempt:0,critPct:0};
  team=T;
  if(!run){ return T; }
  const pax=run.pax, cap=run.capacity, empties=Math.max(0,cap-pax.length);
  assignTrickWilds();
  const cnt={},tagN={},tagSet={};
  pax.forEach(p=>{
    paxIds(p).forEach(i=>{ cnt[i]=(cnt[i]||0)+1;
      DEFS[i].tags.forEach(t=>{ (tagSet[t]=tagSet[t]||{})[i]=1; }); });
    paxTags(p).forEach(t=>{ tagN[t]=(tagN[t]||0)+1; });
  });
  const n=id=>cnt[id]||0, tag=t=>tagN[t]||0;
  const hasTag=(p,t)=>paxTags(p).indexOf(t)>=0;
  const distinctTag=t=>Object.keys(tagSet[t]||{}).length;

  pax.forEach(p=>{ p.add=p.mod; p.mul=1; });

  pax.forEach(p=>{
    switch(p.id){
      case 'spear': if(n('knight')||n('swordsman')) p.add+=4; break;
      case 'shield': T.def+=0.08; break;
      case 'merc': T.mercCost+=15; break;
      case 'summon': p.add+=empties*5; break;
      case 'paladin': if(n('knight')&&n('priest')) p.add+=10; break;
      case 'inquis': p.add+=4*tag('어둠'); break;
      case 'corpse': if(n('necro')) p.add+=6+Math.min(6,Math.floor(run.floor/5)); break;
      case 'demon': p.add+=4*Math.min(4,Math.max(0,tag('어둠')-1)); break;
      case 'trader': T.battleMul*=1.25; break;
      case 'collect': T.battleMul*=1+0.06*Object.keys(cnt).length; break;
      case 'gambler': T.wild=true; T.unstable=true; T.critPct+=0.18; break;
      case 'jester': T.unstable=true; break;
      case 'alchem': T.regen+=3; break;
      case 'priest': T.regen+=3; break;
      case 'cook': T.cookRegen+=2.5; break;
      case 'seer': T.foresee=true; T.def+=0.15; break;
      /* --- 신규 --- */
      case 'apprentice': p.add+=Math.min(6, pax.filter(q=>q.def.rar>=2).length*2); break;
      case 'porter': p.add+=pax.length; break;
      case 'hound': p.add+=2*Math.max(0,tag('괴물')-1); break;
      case 'bomber': T.execPct+=0.08; break;
      case 'silversmith': p.add+=Math.min(8,Math.floor(run.gold/250)*2); break;
      case 'chorister': p.add+=2*Math.max(0,tag('신성')-1); break;
      case 'ronin': if(tag('전투')<=1) p.mul*=2; break;
      case 'chrono': T.atkItv=0.85; break;
      case 'pactdemon': T.pactN++; break;
      case 'herald': T.heraldN++; break;
    }
  });
  T.trickAmbig=trickAmbig;
  T.critPct=Math.min(0.45,T.critPct);
  T.poisonPct=Math.min(0.03, 0.015*n('poisoner'));
  T.mItv=Math.min(1.5, 0.5*n('cryo'));
  if(T.pactN) pax.forEach(q=>{ if(hasTag(q,'어둠')&&q.id!=='pactdemon') q.add+=Math.min(10,6*T.pactN); });
  if(n('goldking')){ const b=Math.min(4,Math.floor(run.gold/500));
    pax.forEach(q=>q.add+=b); T.goldMul*=1.25; }
  if(n('hero')&&distinctTag('전투')>=4) pax.forEach(q=>{ if(hasTag(q,'전투')) q.mul*=1.5; });
  if(n('archmage')){ T.archmage=true; pax.forEach(q=>{ if(hasTag(q,'마법')) q.mul*=1.3; }); }
  if(n('queen')) pax.forEach(q=>{ if(hasTag(q,'괴물')) q.mul*=2; });
  if(n('manager')) pax.forEach(q=>q.mul*=1.1);
  if(n('antiquary')&&new Set(pax.map(q=>q.def.rar)).size>=4){
    pax.forEach(q=>q.mul*=1.25); T.goldMul*=1.4; }
  if(n('storm')&&tag('마법')>=3) pax.forEach(p=>{ if(hasTag(p,'마법')) p.add+=6; });
  if(n('priest')) pax.forEach(p=>{
    if(p.id==='vampire') p.add-=3*n('priest');
    else if(p.id!=='priest') p.add+=1*n('priest'); });
  if(n('curse')){ T.mAtkMul*=Math.pow(1.12,n('curse')); pax.forEach(p=>p.mul*=Math.pow(1.2,n('curse'))); }
  if(n('king')) pax.forEach(p=>{ if(p.id!=='king') p.add+=3*n('king'); });
  if(n('monk')&&tag('경제')===0) pax.forEach(p=>{ if(p.id==='monk') p.mul*=2; });
  if(n('twin')>=2) pax.forEach(p=>{ if(p.id==='twin') p.mul*=3; });

  const C1={n,tag,hasTag,distinctTag,pax,cap,empties,T,
            each:(pred,fn)=>pax.forEach(p=>{ if(pred(p)) fn(p); })};
  COMBOS.forEach(cb=>{ let ok=false; try{ ok=cb.test(C1); }catch(e){}
    if(ok){ T.combos.push(cb); try{ cb.apply(C1); }catch(e){} } });
  if(T.summonX>1) pax.forEach(p=>{ if(p.id==='summon') p.add+=empties*5; });

  const trainMul=1+mem.upg.train*0.04;
  const MUL_CAP=4;   /* 조합 곱연산 누적 상한 — 특정 빌드의 폭주 방지 */
  pax.forEach(p=>{ p.mulRaw=p.mul; p.mul=Math.min(MUL_CAP,p.mul);
    p.atk=Math.max(0,Math.round((p.def.atk+p.add)*p.mul*trainMul*p.jokerMul)); });
  /* 그림자 분신: 자신 제외 최고 공격력의 shadowRate배 복사 + 빈자리당 +20% */
  const shadows=pax.filter(p=>p.id==='shadow');
  if(shadows.length){
    const best=pax.filter(p=>p.id!=='shadow').reduce((m,p)=>Math.max(m,p.atk),0);
    shadows.forEach(p=>{ p.atk=Math.max(p.atk,Math.round(best*T.shadowRate*(1+0.2*empties))); });
  }
  /* 공격력 비례 선제/지속 (최종 공격력 확정 후 계산) */
  pax.forEach(p=>{
    if(p.id==='archer') T.preempt+=p.atk*4;
    else if(p.id==='mage') T.preempt+=p.atk*3;
    else if(p.id==='pyro') T.burn+=p.atk;
  });
  T.atk=pax.reduce((s,p)=>s+p.atk,0);
  if(T.heraldN) T.preempt+=Math.round(T.atk*Math.min(0.6,0.3*T.heraldN));
  T.def=Math.min(.55,T.def);
  if(!predicting) syncHUD();
  return T;
}

/* ---------------------------- 몬스터 / 예측 ---------------------------- */
function rollMonster(floor,forceId){
  let boss=floor%10===0;
  let id;
  if(forceId){ id=forceId; boss=BOSSES.indexOf(forceId)>=0; }
  else if(boss) id=BOSSES[Math.min(BOSSES.length-1,Math.max(0,Math.floor(floor/10)-1))];
  else if(!forceId) id=pick(floor<10?['slime','goblin','skelknight','bat']:(floor<20?NORMAL_MONS.slice(0,7):NORMAL_MONS));
  const b=MONS[id];
  let hpMul=boss?(1+floor*0.20):(1+floor*0.22+floor*floor*0.008), atkMul=1+floor*0.07;
  if(floor<=10){ hpMul*=0.62; atkMul*=0.60; }
  else atkMul*=1+(floor-10)*0.013;
  /* 심층: 30층 이후 공격력이 가파르게 상승 (전투 시간은 유지) */
  if(floor>20){ const d=floor-20; atkMul*=1+d*0.018+d*d*0.0006; hpMul*=1+d*0.018; }
  return {id,def:b,name:b.name,floor,hp:Math.round(b.hp*hpMul),max:Math.round(b.hp*hpMul),
          atk:Math.round(b.atk*atkMul*monsterAtkBoost),itv:b.itv,boss};
}
function nextBattleFloor(){ return run?(Math.floor(run.floor/5)+1)*5:5; }
function resistFor(m,t){ const r=m.def.res||{}; return r[t]!==undefined?r[t]:1; }
/* 승객별 실효 피해 배율: 속성 저항 + 대마법사(저항 무시) + 성가대원(언데드 특효) */
function effRes(m,p){
  const t=dmgType(p); let mul=resistFor(m,t);
  if(team.archmage&&t==='magic'&&mul<1) mul=1;
  if(p.id==='chorister'&&m.def.undead) mul*=1.3;
  return mul;
}

const GRADE_COLORS=['#7ce0b0','#a8e07c','#f0c04a','#f08a3c','#e8635a','#d4453a'];
function predict(mon,extraId,removeUid){
  if(!run||!mon) return null;
  let backup=null;
  let wildBak=null;
  if(extraId){ predicting=true; backup=run.pax.slice();
    wildBak=backup.map(p=>p.wild);
    let arr=run.pax.slice();
    if(removeUid!==undefined) arr=arr.filter(p=>p.uid!==removeUid);
    run.pax=arr.concat([makePax(extraId,true)]); computeStats(); }
  const T=team, pax=run.pax;
  function calc(extraDps){
    let dps=0; pax.forEach(p=>{ dps+=p.atk*effRes(mon,p); });
    dps/=T.atkItv;
    dps+=T.burn + mon.max*T.poisonPct + (extraDps||0);
    if(pax.some(p=>p.id==='swordsman')) dps*=1.15;
    if(pax.some(p=>p.id==='assassin')) dps*=1.2;
    dps*=1+T.critPct;
    const hp=Math.max(1, mon.hp-T.preempt-mon.max*T.execPct);
    const itv=mon.itv+T.mItv;
    const greedMul=mon.def.trait==='greed'?1+Math.min(0.9,run.gold/6000):1;
    const perHit=Math.max(1,Math.round(mon.atk*T.mAtkMul*greedMul*(1-T.def)));
    const netDps=dps-(mon.def.trait==='drain'?perHit*0.45/itv:0);
    const ttk=netDps>0?hp/netDps:999;
    let hitsF=Math.min(ttk,12)/itv;
    if(ttk>12) hitsF+=(Math.min(ttk,18)-12)/(itv/2);
    if(ttk>18) hitsF+=(ttk-18)/(itv/3);
    const hits=Math.max(0,Math.floor(hitsF));
    let dmg=hits*perHit;
    const pn=Math.max(0,T.pactN-T.pactExempt);
    if(pn) dmg+=Math.round(run.maxHp*0.2*pn);
    return {dps,netDps,itv,perHit,ttk,hits,dmg};
  }
  let c=calc(0);
  /* 광전사: 예상 피해가 최대 HP의 40% 이상이면 후반부 ×2 발동을 평균 반영 */
  const bAtk=pax.filter(p=>p.id==='berserker').reduce((sm,p)=>sm+p.atk*effRes(mon,p),0);
  if(bAtk>0&&c.dmg>run.maxHp*0.4) c=calc(bAtk*0.6/T.atkItv);
  const dps=c.dps,netDps=c.netDps,itv=c.itv,perHit=c.perHit,ttk=c.ttk,hits=c.hits,dmg=c.dmg;
  const regenTotal=(netDps>0)?((T.regen+T.cookRegen)*Math.min(ttk,25)):0;
  const remain=Math.round(Math.min(run.maxHp,run.hp+regenTotal-dmg));
  const pct=remain/run.maxHp;
  let gi;
  if(netDps<=0||remain<=0) gi=5;
  else if(pct>=.8) gi=0; else if(pct>=.6) gi=1; else if(pct>=.35) gi=2;
  else if(pct>=.15) gi=3; else gi=4;
  const grade=['매우 안전','안전','접전','위험','매우 위험','패배 예상'][gi];
  const res={dps:Math.round(netDps),ttk:Math.round(ttk*10)/10,hits,perHit,dmg,remain,grade,gi,
             regen:Math.round(regenTotal),unstable:T.unstable,itv:Math.round(itv*10)/10,
             trickAmbig:!!T.trickAmbig,
             martyr:(gi===5&&pax.some(p=>p.id==='martyr')&&!run.martyrUsed),
             doctor:(gi>=3&&pax.some(p=>p.id==='doctor')&&!run.doctorUsed)};
  if(backup){ run.pax=backup; backup.forEach((p,i)=>p.wild=wildBak[i]); predicting=false; computeStats(); }
  return res;
}

/* ---------------------------- HUD ---------------------------- */
function syncHUD(){
  if(!run) return;
  $('hFloor').textContent='지하 '+run.floor+'층';
  $('hGold').textContent=fmt(run.gold)+' 골드';
  $('mult').textContent=run.mult>1?('×'+run.mult):'';
  $('hpFill').style.width=(clamp(run.hp/run.maxHp,0,1)*100)+'%';
  $('hpNum').textContent=Math.max(0,Math.round(run.hp))+'/'+run.maxHp;
  $('comboBtn').textContent='조합 '+((team.combos||[]).length);
  $('btnFast').hidden=!(phase==='battle'&&bs&&!bs.over);
  $('hPax').textContent='탑승 '+run.pax.length+'/'+run.capacity+(mem.upg.keep?(' · 킵 '+run.keep.length+'/'+mem.upg.keep):'');
  $('btnKeep').innerHTML='킵<b>'+run.keep.length+'/'+mem.upg.keep+'</b>';
  if(mem.upg.keep<1) $('btnKeep').hidden=true;
  updateNextInfo();
}
function updateNextInfo(){
  if(!run){ $('nextInfo').textContent='엘리베이터 앞'; return; }
  if(phase==='battle'&&bs){
    const m=bs.mon;
    $('nextInfo').innerHTML='전투 중 · <b>'+m.name+'</b> '+Math.max(0,Math.round(m.hp))+'/'+m.max+
      ' · 내 공격력 '+fmt(team.atk);
    return;
  }
  const m=run.nextMon; if(!m){ $('nextInfo').textContent='다음 전투 정보'; return; }
  const nf=nextBattleFloor(), left=nf-run.floor, pr=predict(m);
  $('nextInfo').innerHTML='다음 전투 <b>'+nf+'층</b>'+(left>0?' · '+left+'층 남음':'')+'<br>'+
    (m.boss?'★ ':'')+m.name+' · 예상 <b style="color:'+GRADE_COLORS[pr.gi]+'">'+pr.grade+'</b>'+
    (pr.unstable?' <span style="color:#f0a02a">※불안정</span>':'');
}

  clearTimeout(e._t); e._t=setTimeout(()=>e.style.opacity=0,ms||1000);

function drawInterior(){
  if(BG_IMG.complete && BG_IMG.naturalWidth){
    const s = Math.max(W / BG_IMG.naturalWidth, H / BG_IMG.naturalHeight);
    const dw = BG_IMG.naturalWidth * s, dh = BG_IMG.naturalHeight * s;
    ctx.drawImage(BG_IMG, (W - dw) / 2, (H - dh) / 2, dw, dh);
  } else {
    ctx.fillStyle = '#0d161c'; ctx.fillRect(0, 0, W, H);
  }
}
function drawCorridor(){
  /* 문 뒤 임시 배경은 제거됨 — 배경 이미지가 그대로 비쳐 보인다.
     탈출 구간의 '탈출구' 표시만 정보 요소로 남긴다. */
  if(corridorMood!=='exit') return;
  const d=DOOR, cx=195;
  ctx.save(); ctx.beginPath(); ctx.rect(d.x,d.y,d.w,d.h); ctx.clip();
  ctx.fillStyle='#0d2a1c'; ctx.fillRect(cx-44,d.y+92,88,32);
  ctx.strokeStyle='#5ae096'; ctx.lineWidth=2; ctx.strokeRect(cx-44,d.y+92,88,32);
  ctx.fillStyle='#8bffc0'; ctx.font='bold 17px sans-serif'; ctx.textAlign='center';
  ctx.fillText('탈출구',cx,d.y+114);
  ctx.restore();
}
function drawDoors(){
  const a=DOOR_ART;
  /* 닫힘 위치를 중앙으로 붙인 만큼 열릴 때 이동량도 함께 늘려 완전히 비켜나게 한다 */
  const off=doorOpen*(a.w/2+2+DOOR_INSET);
  if(!(DOOR_L.complete&&DOOR_L.naturalWidth&&DOOR_R.complete&&DOOR_R.naturalWidth)) return;
  ctx.save();
  ctx.beginPath(); ctx.rect(a.x,a.y,a.w,a.h); ctx.clip();
  const hw=a.w/2;                                     /* 문짝 한 짝의 표시 폭 */
  const sc=hw/DOOR_L.naturalWidth;                    /* 비율 유지 스케일 */
  const dh=DOOR_L.naturalHeight*sc;
  const dy=a.y+(a.h-dh)/2+DOOR_DROP;                  /* 세로 중앙 + 아래로 이동 */
  ctx.drawImage(DOOR_L, a.x+DOOR_INSET-off,        dy, hw, dh);
  ctx.drawImage(DOOR_R, a.x+hw-DOOR_INSET+off,     dy, hw, dh);
  ctx.restore();
}
/* '지하 N층' 모니터를 문 바로 위 석벽 띠에 얹히도록 내리는 양 */
const PANEL_DROP=61;
function drawPanel(){
  const py=82+SHIFT_Y+PANEL_DROP;
  ctx.fillStyle='#0d1418'; ctx.fillRect(150,py,90,18);
  ctx.strokeStyle='#5a4a2a'; ctx.lineWidth=2; ctx.strokeRect(150,py,90,18);
  ctx.fillStyle=phase==='descend'?'#ff8a3c':'#d4453a';
  ctx.font='bold 12px sans-serif'; ctx.textAlign='center';
  ctx.fillText('지하 '+(run?run.floor:0)+'층',195,py+14);
}
function drawPax(){
  if(!run) return;
  const list=run.pax.slice().sort((a,b)=>(a.py+a.oy)-(b.py+b.oy));
  if(tut.on&&tut.arrowPax) for(const p of list) tutArrow(p.px,headY(p)-26,time);
  for(const p of list){
    const bob=Math.sin(time*2.6+p.bob)*2.2*p.ps, opt={};
    if(p.flash>0){ opt.tint='#fff'; opt.tintA=p.flash; }
    else if(p.glow>0){ opt.tint='#7ae86a'; opt.tintA=p.glow*.6; }
    else if(p.id==='corpse'&&run.pax.some(q=>q.id==='necro')){ opt.tint='#5ae06a'; opt.tintA=.2; }
    drawSprite(p.def.spr,p.px+p.ox,p.py+p.oy+bob,p.ps,opt);
    const bx=p.px+p.ox, by=p.py+p.oy+bob+5;
    const ny=p.py+p.oy+bob-64*p.ps*SPRITE_SCALE;
    ctx.font='bold 9px sans-serif'; ctx.textAlign='center';
    const nw=ctx.measureText(paxName(p)).width+8;
    ctx.fillStyle='rgba(0,0,0,.66)'; ctx.fillRect(bx-nw/2,ny-9,nw,12);
    ctx.fillStyle=RAR[p.def.rar].c; ctx.fillText(paxName(p),bx,ny);
    if(p.atk>0){
      ctx.fillStyle='rgba(0,0,0,.62)'; ctx.fillRect(bx-16,by-9,32,13);
      ctx.fillStyle=RAR[p.def.rar].c; ctx.fillRect(bx-16,by-9,2,13);
      ctx.fillStyle='#f0c04a'; ctx.font='bold 10px sans-serif'; ctx.textAlign='center';
      ctx.fillText(p.atk,bx+1,by+1);
    }
    if(replaceMode){
      ctx.strokeStyle='rgba(212,69,58,'+(.5+Math.sin(time*6)*.3)+')'; ctx.lineWidth=2;
      ctx.strokeRect(bx-25*p.ps,p.py+p.oy-68*p.ps,50*p.ps,70*p.ps);
    }
  }
}
function drawCandidates(){
  if(!candidates.length) return;
  const d=DOOR, pos=candPos(candidates.length);
  ctx.save(); ctx.beginPath(); ctx.rect(d.x,d.y,d.w,d.h+4); ctx.clip();
  candidates.forEach((c,i)=>{
    const q=pos[i], sel=selCand===i, bob=Math.sin(time*2.4+i)*2.4, s=q.s*(sel?1.14:1);
    if(tut.on&&tut.arrowCand&&tut.arrowCand.indexOf(c.def.id)>=0) tutArrow(q.x,q.y-132,time);
    if(sel){
      ctx.fillStyle='rgba(255,216,138,.14)'; ctx.fillRect(q.x-30,q.y-74,60,80);
      ctx.strokeStyle='#ffd88a'; ctx.lineWidth=2; ctx.strokeRect(q.x-30,q.y-74,60,80);
    }
    drawSprite(c.def.spr,q.x,q.y+bob,s);
    ctx.textAlign='center';
    const ly=q.y-122, bw=candidates.length>=3?70:88;
    ctx.fillStyle='rgba(0,0,0,.72)'; ctx.fillRect(q.x-bw/2,ly,bw,38);
    ctx.fillStyle=RAR[c.def.rar].c; ctx.fillRect(q.x-bw/2,ly,bw,2);
    ctx.fillStyle=sel?'#ffd88a':'#eef2f6'; ctx.font='bold 11px sans-serif';
    ctx.fillText(c.def.name,q.x,ly+14);
    ctx.fillStyle=RAR[c.def.rar].c; ctx.font='9px sans-serif';
    ctx.fillText(RAR[c.def.rar].n+' · 공 '+c.def.atk,q.x,ly+25);
    ctx.fillStyle='#93a8b2'; ctx.font='8.5px sans-serif';
    ctx.fillText(c.def.tags.join('·'),q.x,ly+35);
    if(run&&run.floor<=2&&selCand<0&&!tut.on){
      ctx.fillStyle='#ffd88a'; ctx.font='bold 15px sans-serif';
      ctx.fillText('▼',q.x,ly-6+Math.sin(time*5)*4);
    }
  });
  ctx.restore();
}
function drawBattleScene(){
  if(!bs) return;
  const m=bs.mon, d=DOOR;
  ctx.save(); ctx.beginPath(); ctx.rect(d.x,d.y,d.w,d.h+4); ctx.clip();
  ctx.globalAlpha=m.hp<=0?Math.max(0,1-bs.deadT*1.5):1;
  drawSprite(m.def.spr,195+bs.mox,DOOR_B-8-BOSS_LIFT+Math.sin(time*3)*3,m.boss?1.9:1.5,
             bs.mflash>0?{tint:'#fff',tintA:bs.mflash}:{});
  ctx.globalAlpha=1; ctx.restore();
  const bw=d.w-16, bx=d.x+8, by=d.y+10-BOSS_LIFT;
  ctx.fillStyle='rgba(0,0,0,.7)'; ctx.fillRect(bx,by,bw,14);
  ctx.fillStyle='#d4453a'; ctx.fillRect(bx,by,bw*clamp(m.hp/m.max,0,1),14);
  ctx.strokeStyle='rgba(255,255,255,.3)'; ctx.lineWidth=1; ctx.strokeRect(bx,by,bw,14);
  ctx.fillStyle='#fff'; ctx.font='bold 10px sans-serif'; ctx.textAlign='center';
  ctx.fillText(m.name+'  '+Math.max(0,Math.round(m.hp))+' / '+m.max,195,by+11);
}
function drawFloats(){
  ctx.textAlign='center';
  floats.forEach(f=>{
    ctx.globalAlpha=clamp((1-f.t/f.life)*1.6,0,1);
    ctx.font='bold '+f.size+'px sans-serif';
    ctx.fillStyle='#000'; ctx.fillText(f.text,f.x+1,f.y+1);
    ctx.fillStyle=f.color; ctx.fillText(f.text,f.x,f.y);
    ctx.globalAlpha=1;
  });
}
function tutArrow(x,y,t){
  const b=Math.sin(t*5)*3;
  ctx.fillStyle='#ffd23f'; ctx.beginPath();
  ctx.moveTo(x,y+10+b); ctx.lineTo(x-9,y-5+b); ctx.lineTo(x+9,y-5+b); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#00000055'; ctx.fillRect(x-9,y-5+b,18,2);
}
function render(){
  ctx.save();
  if(shake>0) ctx.translate(Math.round(rnd(-shake,shake)),Math.round(rnd(-shake,shake)));
  drawInterior(); drawCorridor(); drawCandidates();
  if(bs) drawBattleScene();
  drawDoors(); drawPanel(); drawPax(); drawFloats();
  ctx.restore();
  if(flashRed>0){ ctx.fillStyle='rgba(212,69,58,'+flashRed*.45+')'; ctx.fillRect(0,0,W,H); }
  if(flashWhite>0){ ctx.fillStyle='rgba(255,255,255,'+flashWhite*.55+')'; ctx.fillRect(0,0,W,H); }
  const v=ctx.createRadialGradient(195,430,180,195,430,520);
  v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,.55)');
  ctx.fillStyle=v; ctx.fillRect(0,0,W,H);
}

/* ---------------------------- 루프 ---------------------------- */
let last=performance.now();
function tick(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; time+=dt;
  doorOpen+=(doorTarget-doorOpen)*Math.min(1,dt*7);
  if(shake>0) shake=Math.max(0,shake-dt*6);
  if(flashRed>0) flashRed=Math.max(0,flashRed-dt*2.2);
  if(flashWhite>0) flashWhite=Math.max(0,flashWhite-dt*4);
  if(run) run.pax.forEach((p,i)=>{
    const s=SLOTS[i]; if(s){ p.tx=s.x; p.ty=s.y; p.ts=s.s; }
    p.px+=(p.tx-p.px)*Math.min(1,dt*9);
    p.py+=(p.ty-p.py)*Math.min(1,dt*9);
    p.ps+=(p.ts-p.ps)*Math.min(1,dt*9);
    p.ox+=(0-p.ox)*Math.min(1,dt*7);
    p.oy+=(0-p.oy)*Math.min(1,dt*7);
    if(p.flash>0) p.flash=Math.max(0,p.flash-dt*3);
    if(p.glow>0) p.glow=Math.max(0,p.glow-dt*1.2);
  });
  if(bs){ bs.mox+=(0-bs.mox)*Math.min(1,dt*8);
          if(bs.mflash>0) bs.mflash=Math.max(0,bs.mflash-dt*4);
          if(bs.mon.hp<=0) bs.deadT+=dt;
          if(phase==='battle'&&!bs.over){ for(let k=0;k<battleSpeed&&!bs.over;k++) battleTick(dt); } }
  floats.forEach(f=>{ f.t+=dt; f.y+=f.vy*dt; f.vy*=.96; });
  floats=floats.filter(f=>f.t<f.life);
  render();
  requestAnimationFrame(tick);
}

function startBattle(mon){
  computeStats();
  bs={mon,t:0,mtimer:mon.itv+team.mItv,mox:0,mflash:0,deadT:0,over:false,
      burnT:0,timers:{},sword:{},cookN:{},result:null,stolen:0,raged:false,regenT:0,poisonT:0};
  run.pax.forEach((p,i)=>{ bs.timers[p.uid]=.15+i*.09; bs.sword[p.uid]=0; });
  if(team.mercCost>0&&!team.mercFree){
    run.gold=Math.max(0,run.gold-team.mercCost);
    addFloat(195,470,'-'+team.mercCost+' 골드 (고용비)','#e8635a',12); syncHUD();
  }
  const pactPay=Math.max(0,team.pactN-team.pactExempt);
  if(pactPay>0){
    const c=Math.min(run.hp-1,Math.round(run.maxHp*0.2*pactPay));
    if(c>0){ run.hp-=c; flashRed=.7;
      addFloat(195,DOOR_B+42,'계약의 대가 -'+c,'#c06a8a',15); syncHUD(); }
  }
  const pre=Math.round(team.preempt+mon.max*team.execPct);
  if(pre>0) hitMon(pre,'#6ad0e8','선제 -'+pre);
}
function hitMon(dmg,color,label){
  const m=bs.mon; m.hp-=dmg; bs.mflash=1;
  addFloat(195+rnd(-26,26),DOOR.y+150-BOSS_LIFT,label||('-'+Math.round(dmg)),color||'#ff9a4a',15);
  if(m.hp<0) m.hp=0;
}
function battleTick(dt){
  if(bs.paused) return;
  const m=bs.mon, T=team; bs.t+=dt;
  if(T.regen>0&&m.hp>0&&run.hp<run.maxHp){ bs.regenT+=dt;
    if(bs.regenT>=1){ bs.regenT-=1; const h=Math.min(T.regen,run.maxHp-run.hp);
      run.hp+=h; addFloat(150,DOOR_B+40,'+'+h,'#7ce0b0',13); syncHUD(); } }
  if(T.poisonPct>0&&m.hp>0){ bs.poisonT=(bs.poisonT||0)+dt;
    if(bs.poisonT>=1){ bs.poisonT-=1; const d=Math.max(1,Math.round(m.max*T.poisonPct));
      m.hp-=d; if(m.hp<0)m.hp=0;
      addFloat(195+rnd(-20,20),DOOR.y+196,'독 -'+d,'#9ae05a',12); } }
  if(T.burn>0&&m.hp>0){ bs.burnT+=dt;
    if(bs.burnT>=1){ bs.burnT-=1; m.hp-=T.burn; if(m.hp<0)m.hp=0;
      addFloat(195+rnd(-20,20),DOOR.y+182,'화염 -'+T.burn,'#ff9a3c',12); } }
  if(m.hp>0) run.pax.forEach(p=>{
    if(p.atk<=0) return;
    bs.timers[p.uid]-=dt;
    if(bs.timers[p.uid]<=0){
      bs.timers[p.uid]+=(T.atkItv||1);
      let d=p.atk+(p.id==='swordsman'?bs.sword[p.uid]:0);
      if(p.id==='swordsman') bs.sword[p.uid]+=1;
      d*=effRes(m,p);
      let crit=false;
      if(p.id==='assassin'&&m.hp/m.max<=.3){ d*=3; crit=true; }
      if(p.id==='berserker'&&run.hp<=run.maxHp*0.6){ d*=2; crit=true; }
      if(T.critPct>0&&Math.random()<T.critPct){ d*=2; crit=true; }
      d=Math.max(1,Math.round(d));
      p.ox=(195-p.px)*.22; p.oy=-16; p.flash=.5;
      hitMon(d,crit?'#ff4a4a':'#ff9a4a',(crit?'급소! -':'-')+d);
      crit?SFX.crit():SFX.hit();
      if(p.id==='cook'){
        bs.cookN[p.uid]=(bs.cookN[p.uid]||0)+1;
        if(bs.cookN[p.uid]%4===0&&run.hp<run.maxHp){
          const h=Math.min(10,run.maxHp-run.hp); run.hp+=h;
          addFloat(150,DOOR_B+22,'요리사 +'+h,'#7ce0b0',13); SFX.heal(); syncHUD(); } }
    }
  });
  const rage=bs.t>18?3:(bs.t>12?2:1);
  if(rage>1&&!bs.raged){ bs.raged=true; shake=6;
    addFloat(195,DOOR.y+120,'격노! 공격이 빨라진다','#ff5a5a',15); }
  if(m.hp>0){
    bs.mtimer-=dt*rage;
    if(bs.mtimer<=0){
      bs.mtimer+=m.itv+T.mItv;
      let raw=m.atk*T.mAtkMul;
      if(m.def.trait==='greed') raw*=1+Math.min(0.9,run.gold/6000);
      if(m.def.trait==='exec') raw*=1+(1-run.hp/run.maxHp)*1.2;
      if(m.def.trait==='undead') raw*=1+run.pax.filter(p=>paxTags(p).indexOf('언데드')>=0).length*.12;
      const blocked=Math.round(raw*T.def), dmg=Math.max(1,Math.round(raw-blocked));
      run.hp-=dmg; bs.mox=0; shake=5; flashRed=1; SFX.hurt();
      addFloat(195,DOOR_B+42,'-'+dmg,'#ff5a5a',24);
      addFloat(195,DOOR_B+66,m.name+'의 공격','#ff9a9a',11);
      if(blocked>0) addFloat(285,DOOR_B+66,'방어 -'+blocked,'#8fd8ff',12);
      if(m.def.trait==='drain'){ const h=Math.round(dmg*.45); m.hp=Math.min(m.max,m.hp+h);
        addFloat(195,DOOR.y+182,'흡혈 +'+h,'#ff8ab0',12); }
      if(m.def.trait==='steal'){ const s=Math.min(run.gold,30+run.floor*4); run.gold-=s; bs.stolen+=s;
        addFloat(110,DOOR_B+66,'골드 -'+s,'#f0c04a',12); }
      // 의사
      if(!run.doctorUsed&&run.hp>0&&run.hp<=run.maxHp*.3&&run.pax.some(p=>p.id==='doctor')){
        run.doctorUsed=true; run.hp=Math.min(run.maxHp,run.hp+60);
        addFloat(195,520,'의사 긴급처치 +60','#7ce0b0',15); SFX.heal();
      }
      syncHUD();
    }
  }
  if(m.hp<=0&&!bs.over){ bs.over=true; bs.result='win'; }
  if(run.hp<=0&&!bs.over){
    const mi=run.pax.findIndex(p=>p.id==='martyr');
    if(mi>=0&&!run.martyrUsed){
      run.martyrUsed=true; const mp=run.pax[mi];
      addFloat(mp.px,headY(mp),'순교','#f0d878',17);
      run.pax.splice(mi,1);
      run.hp=Math.round(run.maxHp*0.5);
      flashWhite=1; SFX.heal(); computeStats();
      showToast('순교','순교자가 대가를 치렀다 · HP 50% 회복',1700,'#f0d878');
    } else { run.hp=0; bs.over=true; bs.result='lose'; syncHUD(); }
  }
  if(!bs.over) updateNextInfo();
}

function rarityRoll(floor){
  /* 지하 5층까지는 일반만 등장. 이후 내려갈수록 조금씩 상위 등급이 섞인다.
     목표: 인맥 만렙 기준 희귀 이상 비율이 20층 약 30%, 30층 약 40%. */
  if(floor<=5) return 0;
  const net=mem.upg.network;
  const c=Math.max(52, 92-floor*1.35);
  const r=Math.min(21, 7+floor*0.52)+net*0.5;
  const e=Math.max(0, Math.min(9,(floor-10)*0.45))+net*0.35;
  const l=Math.max(0, Math.min(2.2,(floor-20)*0.15))+net*0.08;
  const tot=c+r+e+l; let x=Math.random()*tot;
  if((x-=c)<=0) return 0;
  if((x-=r)<=0) return 1;
  if((x-=e)<=0) return 2;
  return 3;
}
function rollCandidate(exclude){
  const rar=rarityRoll(run.floor);
  let pool=ORDER.filter(id=>DEFS[id].rar===rar&&exclude.indexOf(id)<0);
  if(!pool.length) pool=ORDER.filter(id=>exclude.indexOf(id)<0);
  const have=k=>run.pax.filter(p=>p.id===k).length;
  const ws=pool.map(id=>{
    let w=10;
    if(id==='paladin'&&have('knight')>=2) w+=14;
    if(id==='rat'&&have('rat')>=2) w+=16;
    if(id==='corpse'&&have('necro')>=1) w+=18;
    if(id==='thief'&&have('rich')>=1) w+=12;
    if(id==='collect'&&have('trader')&&have('rich')) w+=14;
    if(id==='demon'&&run.pax.some(p=>paxTags(p).indexOf('어둠')>=0)) w+=10;
    if(id==='twin'&&have('twin')===1) w+=22;
    if(id==='spear'&&(have('knight')||have('swordsman'))) w+=10;
    if(id==='hound'&&run.pax.some(p=>paxTags(p).indexOf('괴물')>=0)) w+=10;
    if(id==='chorister'&&run.pax.filter(p=>paxTags(p).indexOf('신성')>=0).length>=2) w+=10;
    if(id==='pactdemon'&&run.pax.filter(p=>paxTags(p).indexOf('어둠')>=0).length>=2) w+=10;
    if(id==='silversmith'&&have('miner')) w+=10;
    if(id==='martyr'&&have('chorister')) w+=10;
    if(id==='cryo'&&have('chrono')) w+=12;
    if(DEFS[id].rar===3) w=Math.max(2,w-5);
    return w;
  });
  let tot=0; ws.forEach(x=>tot+=x); let r=Math.random()*tot;
  for(let i=0;i<pool.length;i++){ r-=ws[i]; if(r<=0) return DEFS[pool[i]]; }
  return DEFS[pool[0]];
}

/* 튜토리얼 본편 — 지하 1~6층까지 정해진 흐름으로 진행한 뒤 일반 루프로 넘어간다 */
async function tutorialRun(){
  mem.tutDone=true; save();
  newRun(); run.capacity=4; computeStats();
  tutReset(); tut.on=true; tut.lockKick=true;
  aborted=false;
  setMsg('“지하로 내려갑니다.”');
  await sleep(500);
  await tutSay(TUT.intro,'center');
  if(!tut.on) return;

  /* --- 지하 1층: 검사 / 기사 --- */
  await descend();
  if(!run||aborted) return;
  await passengerPhase({ forced:['swordsman','knight'], quiet:true, onOpen:async()=>{
      tut.allowCand=['swordsman','knight'];
      /* 등장 시점에는 강조하지 않고, 선택을 안내하는 마지막 줄에서 화살표를 띄운다.
         대화창은 태우기를 누를 때까지 유지된다. */
      await tutSay(TUT.f1,'bottom',{holdLast:true});
      tut.arrowCand=['swordsman','knight'];
    }, onBoard:async()=>{ tutClose(); }});
  if(!run||aborted) return;
  tut.arrowCand=null; hl(null); computeStats();
  await tutSay(TUT.afterBoard1,'bottom');
  if(!tut.on) return;

  /* --- 지하 2층: 창병 / 쥐 (창병만 선택 가능) --- */
  await descend();
  if(!run||aborted) return;
  await passengerPhase({ forced:['spear','rat'], onOpen:async()=>{
      tut.allowCand=['spear'];
      await tutSay(TUT.f2,'bottom',{holdLast:true});
      tut.arrowCand=['spear'];
    }, onBoard:async(p)=>{
      tutClose(); tut.arrowCand=null; hl(null);
      computeStats();
      p.flash=1; p.ps*=1.5;                       /* 살짝 커졌다 작아지는 연출 */
      addFloat(p.px,headY(p),'공격력 '+p.atk+'!','#7ce0b0',15);
      SFX.combo(); await sleep(900);
    }});
  if(!run||aborted) return;
  await tutSay(TUT.afterCodex,'bottom');
  if(!tut.on) return;

  /* --- 지하 3~4층: 자유 진행 (내보내기·SKIP 잠금 유지) --- */
  tut.allowCand=null; tut.allowPax=false;
  for(let i=0;i<2;i++){
    await descend(); if(!run||aborted) return;
    await passengerPhase(); if(!run||aborted) return;
    computeStats(); await sleep(120);
  }

  /* --- 지하 5층: 보스 --- */
  await descend(); if(!run||aborted) return;
  run.nextMon=rollMonster(5,'warden');
  const win=await battleFlow({ pre:async()=>{ await tutSay(TUT.boss,'bottom'); } });
  if(aborted) return;
  if(!win){ endRun(false); return; }
  await closeDoors();
  await tutSay(TUT.afterBoss,'bottom');
  if(!tut.on) return;

  /* --- 지하 6층: 정원 초과 교체 --- */
  await descend(); if(!run||aborted) return;
  await passengerPhase({ onOpen:async()=>{
      await tutSay(TUT.f6,'bottom');
      tut.arrowCand=candidates.map(c=>c.def.id);
      tut.allowCand=null;
      tut.tutReplace=true;
    }});
  if(!run||aborted) return;
  tut.tutReplace=false; tut.arrowPax=null; tut.allowPax=false; hl(null);
  await tutSay(TUT.end,'bottom');
  tutReset(); mem.tutDone=true; save();
  loop();
}

async function loop(){
  while(true){
    if(aborted) return;
    await descend();
    if(!run||aborted) return;
    const isBattle=run.floor%5===0, isExit=run.floor%10===0;
    if(isBattle){
      const win=await battleFlow();
      if(aborted) return;
      if(!win){ endRun(false); return; }
      if(isExit){ const cont=await exitChoice(); if(!cont){ endRun(true); return; } }
      await closeDoors();
    } else {
      const tierKey=Math.floor((run.floor-1)/10);
      if(run.floor>6&&run.capacity<10&&!run.repairDone[tierKey]&&Math.random()<.22) await repairEvent();
      if(!run||aborted) return;
      await passengerPhase();
    }
    computeStats();
    await sleep(150);
  }
}

function canvasPos(e){ const r=cv.getBoundingClientRect(); const t=e.touches?e.touches[0]:e;
  return {x:(t.clientX-r.left)/(r.width/W), y:(t.clientY-r.top)/(r.height/H)}; }
function hitTest(x,y){
  if(phase==='choose'&&candidates.length){
    const pos=candPos(candidates.length);
    for(let i=0;i<candidates.length;i++){ const q=pos[i];
      if(x>q.x-31&&x<q.x+31&&y>q.y-120&&y<q.y+10) return {kind:'cand',i}; }
  }
  if(run) for(let i=run.pax.length-1;i>=0;i--){ const p=run.pax[i],
    w=24*p.ps*SPRITE_SCALE, h=64*p.ps*SPRITE_SCALE;
    if(x>p.px-w&&x<p.px+w&&y>p.py-h&&y<p.py+8) return {kind:'pax',i}; }
  return null;
}
cv.addEventListener('pointerdown',e=>{
  ac();
  const q=canvasPos(e), hit=hitTest(q.x,q.y);
  $('comboPanel').style.display='none';
  if(!hit){ if(!replaceMode) hidePopup(); return; }
  if(tut.on&&tut.talking) return;
  if(hit.kind==='cand'&&tut.on&&tut.allowCand&&tut.allowCand.indexOf(candidates[hit.i].def.id)<0) return;
  if(hit.kind==='pax'&&tut.on&&!tut.allowPax) return;
  if(hit.kind==='cand'){
    if(selCand===hit.i){
      if(replaceMode) cancelSelection();
      return;              /* 두 번 탭 탑승 제거 — 탑승은 '태우기' 버튼으로만 */
    }
    selectCandidate(hit.i);
  } else { SFX.sel(); openPopup(hit.i); }
});
/* 새 승객을 태우기 위해 누구를 내보내는 게 가장 이득인지 전수 비교 */
function bestVictim(mon,addId){
  if(!run||!run.pax.length||!mon) return null;
  let best=null,bp=null;
  run.pax.forEach(p=>{
    const pr=predict(mon,addId,p.uid);
    if(!pr) return;
    if(!bp || pr.gi<bp.gi
       || (pr.gi===bp.gi && (pr.remain>bp.remain
       || (pr.remain===bp.remain && pr.dps>bp.dps)))){ bp=pr; best=p; }
  });
  return best;
}
function selectCandidate(i){
  selCand=i; SFX.sel(); $('btnBoard').hidden=false;
  if(tut.on&&tut.arrowCand){ tut.arrowCand=null; hl('btnBoard'); }
  $('btnAd').hidden=replaceMode; updateActBtns();
  const d=candidates[i].def;
  const full=run.pax.length>=run.capacity;
  let victim=null;
  if(full&&run.pax.length) victim=bestVictim(run.nextMon,d.id)||run.pax.slice().sort((a,b)=>a.atk-b.atk)[0];
  const cur=predict(run.nextMon), aft=predict(run.nextMon,d.id,victim?victim.uid:undefined);
  let delta='';
  if(cur&&aft){
    /* 등급이 같아도 실제 전투력 변화를 알 수 있게 초당 공격력·예상 잔여 HP까지 비교 */
    const dDps=aft.dps-cur.dps, dRem=aft.remain-cur.remain;
    const up  = aft.gi<cur.gi || (aft.gi===cur.gi && (dDps>0 || (dDps===0&&dRem>0)));
    const down= aft.gi>cur.gi || (aft.gi===cur.gi && (dDps<0 || (dDps===0&&dRem<0)));
    const same=!up&&!down;
    const mark= same?'<span style="color:#8fa3ad">(변화 없음)</span>'
      :(up?'<b style="color:#7ce0b0">▲</b>':'<b style="color:#e8635a">▼</b>');
    const dpsTxt= same?'':' <span style="color:#8fa3ad">· 초당 '+fmt(cur.dps)+' → </span><b style="color:'+
      (up?'#7ce0b0':'#e8635a')+'">'+fmt(aft.dps)+'</b>';
    const uncertain=(cur.trickAmbig||aft.trickAmbig)?' <span style="color:#f0a02a">※사기꾼 변장에 따라 달라질 수 있음</span>':
                    (cur.unstable?' <span style="color:#f0a02a">※불확실</span>':'');
    delta='<br><span style="color:#8fa3ad">'+(victim?('<b style="color:#e8a0a0">'+victim.def.name+'</b> 대신 태우면 '):'태우면 ')+'</span>'+
      '<b style="color:'+GRADE_COLORS[cur.gi]+'">'+cur.grade+'</b> → '+
      '<b style="color:'+GRADE_COLORS[aft.gi]+'">'+aft.grade+'</b> '+mark+dpsTxt+uncertain;
  }
  let tail='';
  if(replaceMode) tail='<br><span style="color:#ff9a9a">내보낼 승객을 탭하면 교체됩니다. (같은 후보를 다시 탭하면 취소)</span>';
  setMsg('<b style="color:'+RAR[d.rar].c+'">'+d.name+'</b> <span style="color:'+RAR[d.rar].c+'">('+RAR[d.rar].n+')</span> '+d.desc+delta+tail);
}
function cancelSelection(){
  selCand=-1; replaceMode=false; keepPending=-1; SFX.sel();
  $('btnBoard').hidden=true; $('btnAd').hidden=false; updateActBtns();
  setMsg(run.baseMsg||'태울 승객을 탭하세요. ('+run.pax.length+'/'+run.capacity+')');
}
function tryBoard(){
  if(selCand<0) return;
  if(run.pax.length>=run.capacity){
    replaceMode=true;
    showToast('정원 초과','내보낼 승객을 탭하세요',1300,'#d4453a');
    selectCandidate(selCand);
    if(tut.on&&tut.tutReplace){
      tut.arrowCand=null; hl(null); tut.allowPax=false;
      run.pax.forEach(p=>{ p.glow=1; });
      setTimeout(async()=>{
        await tutSay(TUT.f6kick,'bottom');
        tut.allowPax=true; tut.arrowPax=true;
      },2000);
    }
    return;
  }
  const i=selCand; selCand=-1; hideActs();
  resolveInput({type:'board',i});
}
function openPopup(i){
  const p=run.pax[i]; popupIdx=i; const d=p.def;
  $('pName').innerHTML=paxName(p)+' <span style="font-size:11px;color:'+RAR[d.rar].c+'">'+RAR[d.rar].n+'</span>';

    (p.wild?'<span class="tag" style="color:#f0c04a;border-color:#7a5a20">'+DEFS[p.wild].name+' 취급</span>':'');
  const tm=1+mem.upg.train*0.06;
  let br='기본 '+d.atk;
  if(p.add) br+=(p.add>0?' + ':' − ')+Math.abs(p.add);
  if(p.mul!==1) br+=' × '+(Math.round(p.mul*100)/100);

  $('pAtk').innerHTML='공격력 '+p.atk+
    '<div style="font-size:9.5px;color:#7f939c;margin-top:2px;font-weight:400">'+br+

  $('pDesc').innerHTML=d.desc+(p.id==='trick'
    ? (p.wild?'<br><span style="color:#f0c04a">지금은 <b>'+DEFS[p.wild].name+'</b>인 척하는 중.</span>'
            : '<br><span style="color:#8fa3ad">완성 직전인 조합이 없어 아직 변장하지 않았다.</span>')
    : '');
  const rel=(team.combos||[]);
  $('pCmb').innerHTML=rel.length?'<div style="font-size:10.5px;color:#7ce0b0;margin-bottom:8px">활성 조합: '+rel.map(c=>c.name).join(', ')+'</div>':'';
  $('pKick').style.display=(phase==='choose')?'':'none';
  $('pKick').textContent=replaceMode?'내보내고 교체':'내보내기';
  if(replaceMode&&selCand>=0&&candidates[selCand]&&run.nextMon){
    const nd=candidates[selCand].def;
    const c0=predict(run.nextMon), c1=predict(run.nextMon,nd.id,p.uid);
    if(c0&&c1){
      const up=c1.gi<c0.gi||(c1.gi===c0.gi&&(c1.dps>c0.dps||(c1.dps===c0.dps&&c1.remain>c0.remain)));
      const dn=c1.gi>c0.gi||(c1.gi===c0.gi&&(c1.dps<c0.dps||(c1.dps===c0.dps&&c1.remain<c0.remain)));
      const mk=(!up&&!dn)?'<span style="color:#8fa3ad">(변화 없음)</span>'
        :(up?'<b style="color:#7ce0b0">▲</b>':'<b style="color:#e8635a">▼</b>');
      $('pCmb').innerHTML='<div style="font-size:10.5px;color:#a9bcc5;margin-bottom:8px">'+
        '이 승객을 <b>'+nd.name+'</b>(으)로 교체하면<br>'+
        '<b style="color:'+GRADE_COLORS[c0.gi]+'">'+c0.grade+'</b> → '+
        '<b style="color:'+GRADE_COLORS[c1.gi]+'">'+c1.grade+'</b> '+mk+
        ' <span style="color:#8fa3ad">· 초당 '+fmt(c0.dps)+' → </span><b>'+fmt(c1.dps)+'</b>'+
        ((c0.trickAmbig||c1.trickAmbig)?'<br><span style="color:#f0a02a">※ 사기꾼 변장에 따라 실제 값은 달라질 수 있습니다</span>':
         (c0.unstable?'<br><span style="color:#f0a02a">※ 도박사·광대의 영향으로 변동될 수 있습니다</span>':''))+
        '</div>'+$('pCmb').innerHTML;
    }
  }
  $('popup').style.display='block';
}
function hidePopup(){ $('popup').style.display='none'; popupIdx=-1; }
function hideActs(){ ['btnPass','btnBoard','btnAd','btnKeep','btnFast'].forEach(k=>$(k).hidden=true);
  $('keepPanel').style.display='none'; }
function refreshCandidates(){
  if(run.adUsed){
    showToast('사용 완료','새로고침은 한 층에 1회만 가능합니다',1300,'#f0a02a');
    return;
  }
  run.adUsed=true;
  const n=candidates.length||2, ex=[]; candidates=[];
  for(let i=0;i<n;i++){ const d=rollCandidate(ex); ex.push(d.id); candidates.push({def:d}); }
  selCand=-1; $('btnBoard').hidden=true;
  replaceMode=false; keepPending=-1; $('btnAd').hidden=false; updateActBtns();
  run.baseMsg='새로운 승객이 도착했다. ('+run.pax.length+'/'+run.capacity+') · 새로고침 사용 완료';
  setMsg(run.baseMsg); SFX.ding();
}
function updateActBtns(){
  if(!run) return;
  $('btnAd').className='btn tiny'+((run.adUsed||tut.on)?' ghost dim':'');
  $('btnKeep').className='btn tiny';
  if(mem.upg.keep<1) $('btnKeep').hidden=true;

}
function keepCandidate(){
  if(mem.upg.keep<1){
    showToast('대기실 없음','로비 업그레이드 "용사 대기실"이 필요합니다',1500,'#f0a02a');
    setMsg('<b style="color:#f0a02a">용사 대기실</b>이 아직 없습니다. 로비 업그레이드에서 대기 자리를 열면 승객을 킵해 두었다가 나중에 교체할 수 있습니다.');
    return;
  }
  if(selCand<0){ openKeepPanel(); return; }
  if(run.keep.length>=mem.upg.keep){ showToast('대기실 가득 참','로비에서 대기실을 확장하세요',1200,'#d4453a'); return; }
  const d=candidates[selCand].def;
  run.keep.push(d); candidates.splice(selCand,1); selCand=-1;
  $('btnBoard').hidden=true; SFX.board(); syncHUD();
  showToast('대기',d.name+' 킵',900,'#8ae0ff');
  setMsg('<b>'+d.name+'</b> 을(를) 대기실에 보관했다. "킵" 버튼으로 언제든 교체할 수 있다.');
  if(!candidates.length) resolveInput({type:'pass'});
}
function openKeepPanel(){
  const el=$('keepPanel');
  if(el.style.display==='block'){ el.style.display='none'; return; }
  let h='';
  if(!run.keep.length) h='<div style="color:#8fa3ad;font-size:11.5px">대기 중인 용사가 없습니다.<br>후보를 선택한 뒤 "킵"을 누르세요.</div>';
  else run.keep.forEach((d,i)=>{
    h+='<div class="keeprow"><span style="color:'+RAR[d.rar].c+'"><b>'+d.name+'</b> · 공 '+d.atk+'</span>'+
       '<button class="btn tiny" data-k="'+i+'">태우기</button>'+
       '<button class="btn tiny ghost" data-kd="'+i+'">버리기</button></div>';
  });
  $('keepList').innerHTML=h; el.style.display='block'; SFX.sel();
  const bs1=$('keepList').querySelectorAll('[data-k]');
  for(let i=0;i<bs1.length;i++) bs1[i].onclick=function(){ boardFromKeep(+this.getAttribute('data-k')); };
  const bs2=$('keepList').querySelectorAll('[data-kd]');
  for(let i=0;i<bs2.length;i++) bs2[i].onclick=function(){
    run.keep.splice(+this.getAttribute('data-kd'),1); syncHUD(); openKeepPanel(); openKeepPanel(); };
}
function boardFromKeep(i){
  if(run.pax.length>=run.capacity){
    keepPending=i; replaceMode=true; $('keepPanel').style.display='none';
    showToast('정원 초과','내보낼 승객을 탭하세요',1300,'#d4453a');
    setMsg('정원('+run.capacity+'명)이 가득 찼습니다. 내보낼 승객을 탭하면 <b>'+run.keep[i].name+'</b>(으)로 교체됩니다.');
    return;
  }
  const d=run.keep.splice(i,1)[0];
  run.pax.push(makePax(d.id));
  applyBoardEffect(d.id);
  computeStats(); checkNewCombos(); SFX.board(); syncHUD();
  $('keepPanel').style.display='none';
  setMsg('<b>'+d.name+'</b> 이(가) 대기실에서 탑승했다.');
}
$('pClose').onclick=()=>{ SFX.sel(); hidePopup(); };
$('pKick').onclick=()=>{
  if(popupIdx<0||!run) return;
  if(tut.on&&tut.lockKick&&!replaceMode){ SFX.hit(); hidePopup();
    showToast('튜토리얼',TUT.blockKick,1800,'#f0a02a'); return; }
  const p=run.pax[popupIdx];
  addFloat(p.px,headY(p),'하차','#8fa3ad',13);
  run.pax.splice(popupIdx,1); computeStats(); hidePopup(); SFX.door();
  if(replaceMode&&keepPending>=0){
    const k=keepPending; replaceMode=false; keepPending=-1;
    boardFromKeep(k);
  } else if(replaceMode&&selCand>=0){
    replaceMode=false; const i=selCand; selCand=-1;
    hideActs();
    resolveInput({type:'board',i});
  } else { replaceMode=false; setMsg('승객을 내보냈다.'); }
};
$('btnBoard').onclick=()=>{ ac(); tryBoard(); };
$('btnPass').onclick=()=>{ ac();
  if(tut.on&&tut.lockKick){ SFX.hit(); showToast('튜토리얼',TUT.blockKick,1800,'#f0a02a'); return; }
  SFX.sel(); selCand=-1; $('btnBoard').hidden=true; resolveInput({type:'pass'}); };

/* ---------------------------- 디버그 ---------------------------- */
/* 모바일 터치에서도 확실히 동작하도록 포인터 기반 탭 처리
   (드래그/스크롤과 구분하기 위해 이동량 10px 이내일 때만 탭으로 인정) */
function onTap(el,fn){
  if(!window.PointerEvent){ el.addEventListener('click',fn); return; }
  let sx=0,sy=0,moved=false,active=false;
  el.addEventListener('pointerdown',e=>{ sx=e.clientX; sy=e.clientY; moved=false; active=true; },{passive:true});
  el.addEventListener('pointermove',e=>{ if(active&&(Math.abs(e.clientX-sx)>10||Math.abs(e.clientY-sy)>10)) moved=true; },{passive:true});
  el.addEventListener('pointercancel',()=>{ active=false; },{passive:true});
  el.addEventListener('pointerup',e=>{ if(active&&!moved){ active=false; fn(e); } else active=false; });
  el.addEventListener('click',e=>{ e.preventDefault(); e.stopPropagation(); });
}
onTap($('dbgBtn'),()=>{ const d=$('dbg'); d.style.display=d.style.display==='block'?'none':'block'; SFX.sel(); });
function dbgNeedRun(){ showToast('런 중에만','로비에서는 사용할 수 없습니다',1100,'#d4453a'); }
function addDbg(id){
  if(!run) return;
  if(run.pax.length>=run.capacity) run.capacity=Math.min(10,run.capacity+1);
  if(run.pax.length>=10) return;
  run.pax.push(makePax(id)); applyBoardEffect(id); computeStats(); checkNewCombos();
}
onTap($('dbg'),e=>{
  let t=e.target;
  while(t&&t!==$('dbg')&&!(t.getAttribute&&(t.getAttribute('data-p')||t.getAttribute('data-d')))) t=t.parentNode;
  if(!t||!t.getAttribute) return;
  const pk=t.getAttribute('data-p');
  if(pk){
    if(!run){ dbgNeedRun(); return; }
    addDbg(pk); SFX.board(); showToast(DEFS[pk].name+' 탑승','정원 '+run.pax.length+'/'+run.capacity,900,'#8ae0ff');
    return;
  }
  const k=t.getAttribute('data-d'); if(!k) return;
  SFX.sel();
  if(!run&&k!=='wipe'&&k!=='mute'){ dbgNeedRun(); return; }
  const label=(t.textContent||'').trim();
  if(k!=='wipe') showToast('개발',label,750,'#8ae0ff');
  if(k==='gold'&&run){ run.gold+=1000; syncHUD(); }
  if(k==='heal'&&run){ run.hp=run.maxHp; computeStats(); }
  if(k==='hp10'&&run){ run.hp=10; computeStats(); }
  if(k==='next'){ if(!waiter) showToast('대기 중','승객 선택 중에만 넘길 수 있습니다',1000,'#f0a02a'); resolveInput({type:'pass'}); }
  if(k==='battle'&&run){ run.floor=Math.floor(run.floor/5)*5+4; run.nextMon=rollMonster(run.floor+1); syncHUD(); resolveInput({type:'pass'}); }
  if(k==='boss'&&run){ run.floor=Math.floor(run.floor/10)*10+9; run.nextMon=rollMonster(run.floor+1); syncHUD(); resolveInput({type:'pass'}); }
  if(k==='cap'&&run){ run.capacity=Math.min(10,run.capacity+1); computeStats(); }
  if(k==='clear'&&run){ run.pax=[]; computeStats(); }
  if(k==='rats'&&run){ run.capacity=Math.max(run.capacity,6); for(let i=0;i<5;i++) addDbg('rat'); }
  if(k==='holy'&&run){ run.capacity=Math.max(run.capacity,6); ['knight','priest','paladin'].forEach(addDbg); }
  if(k==='dark'&&run){ run.capacity=Math.max(run.capacity,6); ['vampire','demon','necro'].forEach(addDbg); }
  if(k==='money'&&run){ run.capacity=Math.max(run.capacity,6); ['rich','thief','trader','collect'].forEach(addDbg); }
  if(k==='mx2'&&run){ monsterAtkBoost*=2; run.nextMon=rollMonster(nextBattleFloor()); syncHUD(); }
  if(k==='reroll'&&run){ run.nextMon=rollMonster(nextBattleFloor()); syncHUD(); }
  if(k==='export'){
    try{
      const j=JSON.stringify(exportGameData(),null,1);
      const a=document.createElement('a');
      a.href='data:application/json;charset=utf-8,'+encodeURIComponent(j);
      a.download='descent_gamedata.json'; a.click();
      showToast('내보내기','descent_gamedata.json ('+Math.round(j.length/1024)+'KB)',1600,'#8ae0ff');
    }catch(e){ showToast('내보내기 실패',String(e.message||e),1600,'#d4453a'); }
  }
  if(k==='tut'){ mem.tutDone=false; save(); showToast('튜토리얼','다음 게임 시작 시 재생됩니다',1400,'#8ae0ff'); }
  if(k==='mute'){ muted=!muted; showToast('소리',muted?'꺼짐':'켜짐',800,'#8ae0ff'); }
  if(k==='wipe'){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
    mem={gold:0,deepest:0,tutDone:false,upg:{cap:0,vit:0,train:0,insure:0,network:0,keep:0},seenPax:{},seenCombo:{}};
    save(); lobby(); }
});
(function(){ const w=$('dbgPax');
  ORDER.forEach(id=>{ const b=document.createElement('button');
    b.textContent=DEFS[id].name; b.setAttribute('data-p',id);
    b.style.color=RAR[DEFS[id].rar].c; w.appendChild(b); });
})();

/* ---------------------------- 부팅 ---------------------------- */
/* ============ Godot 이식 지원 ============
   밸런스 상수·직업·조합·몬스터·튜토리얼 대사를 하나의 JSON으로 내보냅니다.
   Godot 쪽에서는 이 JSON을 Resource(.tres/.json)로 읽어 동일한 규칙을 재현하면 되고,
   렌더링·사운드·연출만 엔진 기능으로 교체하면 됩니다.
   콘솔에서 exportGameData() 또는 개발 메뉴 > 데이터 내보내기. */
const BALANCE={
  monster:{ hpNormal:'1+floor*0.22+floor^2*0.008', hpBoss:'1+floor*0.20',
            atk:'1+floor*0.07', shallow:{atMost:10,hpMul:0.62,atkMul:0.60},
            midRamp:'floor>10: atk *= 1+(floor-10)*0.013',
            deepRamp:'floor>20: atk *= 1+d*0.018+d^2*0.0006, hp *= 1+d*0.018 (d=floor-20)',
            rage:[{atSec:12,atkSpeed:2},{atSec:18,atkSpeed:3}] },
  gold:{ battle:'(35+min(floor,40)*6.5) * tierMult * battleMul * goldMul',
         tierMult:[1.5,1.9,2.4,2.9,3.3,3.6,3.9,4.1,4.3,4.5] },
  run:{ baseCapacity:4, baseHp:100, hpPerTierGain:'max(15, 40-(tier-1)*4)',
        battleEvery:5, exitEvery:10, mulCap:4 },
  rarity:{ formula:{ common:'max(40, 88-floor*1.6)', rare:'min(30, 10+floor*0.7)+net*0.8',
                     epic:'max(0,min(17,(floor-8)*0.85))+net*0.6',
                     legend:'max(0,min(3.5,(floor-18)*0.28))+net*0.15' },
           note:'net = 인맥 업그레이드 레벨' }
};
function exportGameData(){
  const pax=ORDER.map(id=>{ const d=DEFS[id];
    return {id,name:d.name,rarity:d.rar,rarityName:RAR[d.rar].n,tags:d.tags,atk:d.atk,desc:d.desc,
            sprite:{palette:d.spr.pal,rows:d.spr.rows}}; });
  const combos=COMBOS.map(c=>({id:c.id,name:c.name,cond:c.cond,effect:c.eff}));
  const mons=Object.keys(MONS).map(id=>{ const m=MONS[id];
    return {id,name:m.name,hp:m.hp,atk:m.atk,interval:m.itv,resist:m.res||{},trait:m.trait||'',
            undead:!!m.undead,boss:BOSSES.indexOf(id)>=0,desc:m.desc||'',
            sprite:{palette:m.spr.pal,rows:m.spr.rows}}; });
  const upgrades=UPGS.map(u=>({key:u.k,name:u.name,base:u.base,max:u.max,
    costs:Array.from({length:u.max},(_,lv)=>upgCost(u,lv))}));
  return {version:'v2',generated:new Date().toISOString(),
          screen:{w:390,h:844,tile:4,spriteGrid:'12x16'},
          balance:BALANCE, passengers:pax, combos, monsters:mons,
          bosses:BOSSES, legendPool:LEGENDS, upgrades,
          tutorial:{guide:TUT_GUIDE,crowSprite:CROW_SPR,script:TUT},
          grades:GRADE_COLORS};
}
if(typeof window!=='undefined') window.exportGameData=exportGameData;

load(); fit(); requestAnimationFrame(tick);
(function(){
  const t=$('title'); t.style.display='flex';
  onTap(t,()=>{ t.style.display='none'; ac(); SFX.ding(); lobby(); });
})();
